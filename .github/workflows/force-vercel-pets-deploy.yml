name: Force real Pets deployment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-deploy:
    if: github.event.head_commit.message == 'Preparar deploy real de Clientes & Pets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Marcar ações visíveis de adicionar pet
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/modules/petshop/pages/PetsPage.jsx')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<button onClick={() => onAddPet(pet)} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>':
              '<button type="button" data-yuisync-add-pet-action aria-label={`Adicionar outro pet para ${pet.owner_name || \'este tutor\'}`} onClick={() => onAddPet(pet)} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>',
              '<button onClick={() => openAddPetForTutor(pet)} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>':
              '<button type="button" data-yuisync-add-pet-action aria-label={`Adicionar outro pet para ${pet.owner_name || \'este tutor\'}`} onClick={() => openAddPetForTutor(pet)} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>',
              '<button onClick={(e) => { e.stopPropagation(); openAddPetForTutor(pet) }} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>':
              '<button type="button" data-yuisync-add-pet-action aria-label={`Adicionar outro pet para ${pet.owner_name || \'este tutor\'}`} onClick={(e) => { e.stopPropagation(); openAddPetForTutor(pet) }} className="btn btn-primary btn-sm"><Plus size={13}/> Adicionar pet</button>',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Esperava 1 ocorrência, encontrei {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Remover workflow temporário
        run: rm -f .github/workflows/force-vercel-pets-deploy.yml

      - name: Publicar alteração real
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/pages/PetsPage.jsx .github/workflows/force-vercel-pets-deploy.yml
          git commit -m "Forçar publicação real do fluxo de adicionar pet"
          git push origin HEAD:main
