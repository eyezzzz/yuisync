name: Apply MotoDog autofill and duration presets

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        run: |
          sed -i 's/dailyTimelineSlots/DAILY_SLOT_MINUTES = 10/' .github/apply-motodog-duration-fix.py
          python .github/apply-motodog-duration-fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run test:transactions
          npm run test
          npm run typecheck
          npm run build

      - name: Publish functional commit
        run: |
          rm .github/apply-motodog-duration-fix.py
          rm .github/workflows/apply-motodog-duration-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: autofill MotoDog and update bath duration presets"
          git push origin HEAD:${{ github.head_ref }}
