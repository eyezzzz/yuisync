name: Apply agenda live cancel patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-live-cancel-actions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply definitive patch
        run: |
          node scripts/apply-agenda-live-cancel-patch.mjs > /tmp/yuisync-patch-output.log
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const packagePath = 'package.json'
          const pkg = JSON.parse(await readFile(packagePath, 'utf8'))
          pkg.scripts['audit:ci'] = 'node scripts/check-npm-audit.mjs'
          await writeFile(packagePath, `${JSON.stringify(pkg, null, 2)}\n`)

          const pagePath = 'src/modules/petshop/pages/AgendaResolvedPage.jsx'
          let page = await readFile(pagePath, 'utf8')
          const replacements = [
            [
              'body { font-family: Arial, Helvetica, sans-serif; padding: 3mm 0 3mm 2mm; }',
              'body { font-family: Arial, Helvetica, sans-serif; padding: 3mm 2mm; }',
            ],
            [
              '.receipt { width: 64mm; max-width: 64mm; margin: 0; }',
              '.receipt { width: 72mm; max-width: 72mm; margin: 0 auto; }',
            ],
            [
              '.title { margin: 3mm 0 2mm; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 1.6mm 0; font-size: 13px; font-weight: 900; }',
              '.title { margin: 3mm 0 2mm; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 1.6mm 0; font-size: 13.5px; font-weight: 900; }',
            ],
            [
              '.line { display: grid; grid-template-columns: 18mm minmax(0, 1fr); gap: 1.5mm; padding: .8mm 0; font-size: 10.5px; line-height: 1.32; }',
              '.line { display: grid; grid-template-columns: 18mm minmax(0, 1fr); gap: 1.5mm; padding: .8mm 0; font-size: 11px; line-height: 1.32; }',
            ],
            [
              '.line strong { font-size: 9.5px; text-transform: uppercase; }',
              '.line strong { font-size: 10px; text-transform: uppercase; }',
            ],
          ]
          for (const [before, after] of replacements) {
            if (!page.includes(before)) throw new Error(`Print trecho nao encontrado: ${before}`)
            page = page.replace(before, after)
          }
          await writeFile(pagePath, page)

          const testPath = 'test/agendaPrintCleanup.test.mjs'
          let test = await readFile(testPath, 'utf8')
          test += `\n\ntest('impressao usa largura termica centralizada sem folga lateral', async () => {\n  const resolved = await readFile(new URL('../src/modules/petshop/pages/AgendaResolvedPage.jsx', import.meta.url), 'utf8')\n  assert.match(resolved, /body \\{ font-family: Arial, Helvetica, sans-serif; padding: 3mm 2mm; \\}/)\n  assert.match(resolved, /\\.receipt \\{ width: 72mm; max-width: 72mm; margin: 0 auto; \\}/)\n  assert.match(resolved, /font-size: 13\\.5px/)\n  assert.match(resolved, /font-size: 11px/)\n  assert.match(resolved, /font-size: 10px; text-transform: uppercase/)\n})\n`
          await writeFile(testPath, test)
          NODE
          rm -f scripts/apply-agenda-live-cancel-patch.mjs .github/workflows/apply-agenda-live-cancel.yml
      - name: Validate targeted behavior
        run: |
          node --test test/agendaAdaptiveCards.test.mjs test/agendaPrintCleanup.test.mjs
          npm run typecheck
          npm run build
      - name: Commit definitive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tornar agenda fluida e ampliar impressao termica"
          git push origin HEAD:fix/agenda-live-cancel-actions
