name: Apply Final PetBot Runtime Fixes

on:
  pull_request:
    paths:
      - scripts/apply-final-petbot-runtime-fixes.mjs
      - .github/workflows/apply-final-petbot-runtime-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: patch
        name: Apply and validate fixes
        shell: bash
        run: |
          set +e
          {
            node --check scripts/apply-final-petbot-runtime-fixes.mjs
            node scripts/apply-final-petbot-runtime-fixes.mjs
            node --check server/lib/petbotAgent.js
            node --check server/lib/chat.js
            node --check scripts/petbot-diagnostic-suite.mjs
            node --test test/petbotSemantics.test.mjs
          } > patch-final.log 2>&1
          code=$?
          cat patch-final.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petbot-final-patch-diagnostic
          path: patch-final.log
          retention-days: 2

      - name: Stop when patch failed
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1

      - name: Remove temporary patcher
        run: |
          rm scripts/apply-final-petbot-runtime-fixes.mjs
          rm .github/workflows/apply-final-petbot-runtime-fixes.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(petbot): corrigir catálogo e continuidade dos testes vivos"
          git push origin HEAD:test/petbot-predictive-100x
