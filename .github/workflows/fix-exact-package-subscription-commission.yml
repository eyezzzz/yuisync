name: Corrigir comissão completa dos pacotes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correções de comissão dos pacotes
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')

          function replaceSection(source, startMarker, endMarker, replacement, label) {
            const start = source.indexOf(startMarker)
            const end = source.indexOf(endMarker, start)
            assert.ok(start >= 0, `${label}: início não encontrado`)
            assert.ok(end > start, `${label}: fim não encontrado`)
            return source.slice(0, start) + replacement + source.slice(end)
          }

          const corePath = 'src/modules/petshop/hooks/usePetshopAdvancedCore.js'
          let core = fs.readFileSync(corePath, 'utf8')
          const beforeSelect = 'ready_at,notes,subscription_benefit_used,transport_mode'
          const afterSelect = 'ready_at,notes,subscription_id,subscription_benefit_used,transport_mode'
          if (!core.includes(afterSelect)) {
            assert.ok(core.includes(beforeSelect), 'APPT_BASE_SELECT sem o trecho esperado')
            core = core.replace(beforeSelect, afterSelect)
          }
          fs.writeFileSync(corePath, core)

          const packagePath = 'src/modules/petshop/lib/packageCommissionOperations.js'
          let packageSource = fs.readFileSync(packagePath, 'utf8')

          const allocationReplacement = String.raw`const packageServiceText = (service = {}, catalogService = {}) => normalizeText([
            service.service_type,
            service.service_code,
            service.service_name,
            catalogService.code,
            catalogService.name,
            catalogService.category,
            catalogService.group_type,
          ].filter(Boolean).join(' '))

          const isDiscountablePackageService = (service = {}, catalogService = {}) => {
            const text = packageServiceText(service, catalogService)
            return /(?:^|[\s_-])(banho|tosa|tosagem|groom|trim|trimming|stripping)(?:$|[\s_-])/.test(text)
          }

          function assignAllocationPool(entries, pool, unitValues) {
            if (!entries.length) return
            const allPriced = entries.every((entry) => entry.catalog_price > 0)
            const totalWeight = entries.reduce((sum, entry) => (
              sum + entry.qty_per_cycle * (allPriced ? entry.catalog_price : 1)
            ), 0)
            entries.forEach((entry) => {
              const weight = allPriced ? entry.catalog_price : 1
              const unitValue = totalWeight > 0 ? pool * weight / totalWeight : 0
              const rounded = Number(unitValue.toFixed(2))
              unitValues.set(entry.code, rounded)
              unitValues.set(entry.service_type, rounded)
            })
          }

          export function buildPackageCommissionAllocation({ plan = {}, catalogServices = [], settings = {} } = {}) {
            const planServices = normalizedPlanServices(plan.services)
            const catalog = new Map((catalogServices || [])
              .map((service) => [String(service?.code || '').trim(), service])
              .filter(([code]) => code))
            const transportFee = configuredPackageTransportFee(settings)
            const transportQuantity = planServices
              .filter(isTransportService)
              .reduce((sum, service) => sum + service.qty_per_cycle, 0)
            const transportTotal = transportQuantity * transportFee
            const packagePrice = positiveNumber(plan.price)
            const servicePool = Math.max(0, packagePrice - transportTotal)
            const serviceEntries = planServices
              .filter((service) => !isTransportService(service))
              .map((service) => {
                const code = service.service_code || service.service_type
                const catalogService = catalog.get(code) || {}
                return {
                  ...service,
                  code,
                  service_type: service.service_type || code,
                  service_name: String(catalogService.name || service.service_name || code).trim(),
                  group_type: catalogService.group_type || service.group_type || 'banho_tosa',
                  catalog_price: positiveNumber(catalogService.default_price),
                  discountable: isDiscountablePackageService(service, catalogService),
                }
              })
            const totalUnits = serviceEntries.reduce((sum, service) => sum + service.qty_per_cycle, 0)
            const unitValues = new Map()
            const discountableEntries = serviceEntries.filter((entry) => entry.discountable)
            const fixedEntries = serviceEntries.filter((entry) => !entry.discountable)
            const fixedCatalogTotal = fixedEntries.reduce((sum, entry) => (
              sum + entry.qty_per_cycle * entry.catalog_price
            ), 0)
            const canPreserveFixedPrices = discountableEntries.length > 0
              && fixedEntries.every((entry) => entry.catalog_price > 0)
              && fixedCatalogTotal <= servicePool + 0.005

            if (canPreserveFixedPrices) {
              fixedEntries.forEach((entry) => {
                const value = Number(entry.catalog_price.toFixed(2))
                unitValues.set(entry.code, value)
                unitValues.set(entry.service_type, value)
              })
              assignAllocationPool(
                discountableEntries,
                Math.max(0, servicePool - fixedCatalogTotal),
                unitValues,
              )
            } else {
              assignAllocationPool(serviceEntries, servicePool, unitValues)
            }

            const allocatedEntries = serviceEntries.map((entry) => ({
              ...entry,
              package_unit_value: unitValues.get(entry.code)
                ?? unitValues.get(entry.service_type)
                ?? 0,
            }))

            return {
              plan_name: String(plan.name || 'Pacote').trim(),
              package_price: Number(packagePrice.toFixed(2)),
              transport_fee: Number(transportFee.toFixed(2)),
              transport_quantity: transportQuantity,
              transport_total: Number(transportTotal.toFixed(2)),
              service_pool: Number(servicePool.toFixed(2)),
              service_units: totalUnits,
              fixed_service_total: Number(fixedCatalogTotal.toFixed(2)),
              unit_values: unitValues,
              service_entries: allocatedEntries,
              fallback_unit_value: serviceEntries.length === 1
                ? unitValues.get(serviceEntries[0].code) || 0
                : totalUnits > 0 ? Number((servicePool / totalUnits).toFixed(2)) : 0,
            }
          }

          `
          packageSource = replaceSection(
            packageSource,
            'export function buildPackageCommissionAllocation',
            'const appointmentHasPackageSignal',
            allocationReplacement,
            'alocação do pacote',
          )

          const itemHelpers = String.raw`function allocationValueForItem(allocation, item = {}) {
            if (!allocation) return 0
            const candidates = [item.code, item.service_code, item.service_type, item.value]
              .map((value) => String(value || '').trim())
              .filter(Boolean)
            for (const candidate of candidates) {
              if (allocation.unit_values.has(candidate)) return allocation.unit_values.get(candidate)
            }
            return allocation.fallback_unit_value || 0
          }

          function allocationEntryForItem(allocation, item = {}) {
            const entries = Array.isArray(allocation?.service_entries) ? allocation.service_entries : []
            const candidates = new Set([item.code, item.service_code, item.service_type, item.value]
              .map((value) => String(value || '').trim())
              .filter(Boolean))
            return entries.find((entry) => candidates.has(entry.code) || candidates.has(entry.service_type)) || null
          }

          export function buildPackageCommissionItems({ items = [], allocation } = {}) {
            const sourceItems = Array.isArray(items) ? items : []
            if (!allocation) return sourceItems
            const existingCodes = new Set(sourceItems.flatMap((item) => (
              [item.code, item.service_code, item.service_type, item.value]
                .map((value) => String(value || '').trim())
                .filter(Boolean)
            )))
            const enrichedItems = sourceItems.map((item) => ({
              ...item,
              package_covered: true,
              package_plan_name: allocation.plan_name,
              package_unit_price: allocationValueForItem(allocation, item),
              package_service_pool: allocation.service_pool,
              package_transport_total: allocation.transport_total,
            }))
            const matchedEntries = sourceItems
              .map((item) => allocationEntryForItem(allocation, item))
              .filter(Boolean)
            const primaryEntry = matchedEntries.find((entry) => entry.discountable)
              || (allocation.service_entries || []).filter((entry) => entry.discountable).length === 1
                ? (matchedEntries.find((entry) => entry.discountable)
                  || (allocation.service_entries || []).find((entry) => entry.discountable))
                : null
            if (!primaryEntry) return enrichedItems

            const companions = (allocation.service_entries || [])
              .filter((entry) => !entry.discountable
                && entry.catalog_price > 0
                && entry.qty_per_cycle === primaryEntry.qty_per_cycle
                && !existingCodes.has(entry.code)
                && !existingCodes.has(entry.service_type))
              .map((entry) => ({
                code: entry.code,
                service_code: entry.code,
                service_type: entry.service_type,
                name: entry.service_name,
                group_type: entry.group_type || 'banho_tosa',
                unit_price: 0,
                catalog_price: entry.catalog_price,
                benefit_used: true,
                package_covered: true,
                package_component: true,
                package_plan_name: allocation.plan_name,
                package_unit_price: entry.package_unit_value,
                package_service_pool: allocation.service_pool,
                package_transport_total: allocation.transport_total,
              }))
            return [...enrichedItems, ...companions]
          }

          `
          packageSource = replaceSection(
            packageSource,
            'function allocationValueForItem',
            'const subscriptionPriority',
            itemHelpers,
            'componentes do pacote',
          )

          const enrichmentStart = packageSource.indexOf('    const items = Array.isArray(appointment.service_items)', packageSource.indexOf('return source.map'))
          const enrichmentEndMarker = '\n  })\n}'
          const enrichmentEnd = packageSource.indexOf(enrichmentEndMarker, enrichmentStart)
          assert.ok(enrichmentStart >= 0 && enrichmentEnd > enrichmentStart, 'enriquecimento final não encontrado')
          const enrichmentReplacement = String.raw`    const items = Array.isArray(appointment.service_items) ? appointment.service_items : []
            const enrichedItems = buildPackageCommissionItems({ items, allocation })

            return {
              ...appointment,
              subscription_id: appointment.subscription_id || subscription.id,
              package_commission: true,
              package_plan_name: allocation.plan_name,
              package_service_pool: allocation.service_pool,
              package_transport_total: allocation.transport_total,
              package_commission_unit_value: enrichedItems.length === 1
                ? Number(enrichedItems[0].package_unit_price || 0)
                : allocation.fallback_unit_value,
              service_items: enrichedItems,
            }`
          packageSource = packageSource.slice(0, enrichmentStart)
            + enrichmentReplacement
            + packageSource.slice(enrichmentEnd)
          fs.writeFileSync(packagePath, packageSource)

          const summaryPath = 'src/modules/petshop/lib/teamCommissionSummary.js'
          let summary = fs.readFileSync(summaryPath, 'utf8')
          const historyLoop = String.raw`  history.forEach((appointment) => {
            const key = String(appointment.responsible_staff_key || '').trim()
            if (!key) return
            const row = ensure(key, configuredNames.get(key) || appointment.responsible_staff_name || key)
            const lines = appointmentCommissionLines(appointment)
            if (lines.some((line) => line.package_covered)) row.package_count += 1

            lines.forEach((line) => {
              row.service_count += 1
              row.service_revenue += line.revenue
              row.total_commission += line.commission

              if (line.package_covered) {
                row.package_revenue += line.revenue
                row.package_commission += line.commission
                if (line.category === 'bath') row.package_bath_count += 1
                if (['machine_grooming', 'scissor_grooming'].includes(line.category)) row.package_grooming_count += 1
                return
              }

              if (line.category === 'bath') {
                row.bath_count += 1
                row.bath_revenue += line.revenue
                row.bath_commission += line.commission
              } else if (line.category === 'machine_grooming') {
                row.machine_grooming_count += 1
                row.grooming_count += 1
                row.grooming_revenue += line.revenue
                row.grooming_commission += line.commission
              } else if (line.category === 'scissor_grooming') {
                row.scissor_grooming_count += 1
                row.grooming_count += 1
                row.grooming_revenue += line.revenue
                row.grooming_commission += line.commission
              } else {
                row.other_service_count += 1
                row.other_service_revenue += line.revenue
                row.other_service_commission += line.commission
              }
            })
          })`
          summary = replaceSection(
            summary,
            '  history.forEach((appointment) => {',
            '\n\n  return [...rows.values()]',
            historyLoop,
            'agrupamento das comissões',
          )
          fs.writeFileSync(summaryPath, summary)

          fs.writeFileSync('test/packageBundleCommission.test.mjs', `import assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\nimport test from 'node:test'\n\ntest('snapshot carrega a assinatura exata do agendamento', async () => {\n  const source = await readFile(new URL('../src/modules/petshop/hooks/usePetshopAdvancedCore.js', import.meta.url), 'utf8')\n  assert.match(source, /ready_at,notes,subscription_id,subscription_benefit_used/)\n})\n\ntest('pacote preserva escovacao em 10, desconta somente banhos e exclui MotoDog', async () => {\n  const { buildPackageCommissionAllocation, buildPackageCommissionItems } = await import('../src/modules/petshop/lib/packageCommissionOperations.js')\n  const { appointmentCommissionLines, buildCommissionRows } = await import('../src/modules/petshop/lib/teamCommissionSummary.js')\n  const allocation = buildPackageCommissionAllocation({\n    plan: {\n      name: 'Pacote completo',\n      price: 320,\n      services: [\n        { service_type: 'banho_0_10', service_code: 'banho_0_10', qty_per_cycle: 4 },\n        { service_type: 'escovacao', service_code: 'escovacao', qty_per_cycle: 4 },\n        { service_type: 'motodog', qty_per_cycle: 4, group_type: 'transport' },\n      ],\n    },\n    catalogServices: [\n      { code: 'banho_0_10', name: 'Banho pequeno', group_type: 'banho_tosa', default_price: 55 },\n      { code: 'escovacao', name: 'Escovacao', group_type: 'banho_tosa', default_price: 10 },\n    ],\n    settings: { pet_transport_fee: 20 },\n  })\n  assert.equal(allocation.transport_total, 80)\n  assert.equal(allocation.service_pool, 240)\n  assert.equal(allocation.unit_values.get('banho_0_10'), 50)\n  assert.equal(allocation.unit_values.get('escovacao'), 10)\n\n  const items = buildPackageCommissionItems({\n    allocation,\n    items: [{ code: 'banho_0_10', name: 'Banho pequeno', group_type: 'banho_tosa', unit_price: 0, benefit_used: true }],\n  })\n  assert.equal(items.length, 2)\n  assert.equal(items.find((item) => item.code === 'banho_0_10').package_unit_price, 50)\n  assert.equal(items.find((item) => item.code === 'escovacao').package_unit_price, 10)\n  assert.equal(items.some((item) => /motodog/i.test(item.code || '')), false)\n\n  const appointment = {\n    id: 'package-bath-brush',\n    service_group: 'banho_tosa',\n    package_commission: true,\n    subscription_benefit_used: true,\n    service_items: items,\n    responsible_staff_key: 'esteticista-1',\n    responsible_staff_name: 'Estefanea',\n  }\n  const lines = appointmentCommissionLines(appointment)\n  assert.deepEqual(lines.map((line) => line.revenue), [50, 10])\n  assert.equal(Number(lines.reduce((sum, line) => sum + line.commission, 0).toFixed(2)), 3)\n  const [row] = buildCommissionRows([appointment], [{ key: 'esteticista-1', name: 'Estefanea' }])\n  assert.equal(row.package_count, 1)\n  assert.equal(row.package_revenue, 60)\n  assert.equal(row.package_commission, 3)\n})\n`)
          NODE

      - name: Instalar dependências
        run: npm ci

      - name: Testar regressões
        run: node --test test/packageBundleCommission.test.mjs test/clientHistoryLayoutAndPackageCommissionRuntime.test.mjs test/teamDeliveryAndCommissionSummary.test.mjs

      - name: Validar build
        run: npm run build

      - name: Publicar branch validada
        run: |
          rm -f .github/workflows/fix-exact-package-subscription-commission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/package-bundle-commission-all-services
          git add -A
          git commit -m "Calcular todos os serviços incluídos nos pacotes"
          git push --force-with-lease origin HEAD:fix/package-bundle-commission-all-services
