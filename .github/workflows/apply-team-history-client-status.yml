name: Apply team history and client status patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-team-history-client-status.mjs'
      - '.github/workflows/apply-team-history-client-status.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/team-history-and-client-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/team-history-and-client-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply definitive patch
        run: |
          node scripts/apply-team-history-client-status.mjs
          rm -f scripts/apply-team-history-client-status.mjs .github/workflows/apply-team-history-client-status.yml
      - name: Validate targeted behavior
        run: |
          node --test test/teamCommissionHistory.test.mjs test/clientRegistrationStatus.test.mjs test/teamPendingResponsibleAssignment.test.mjs
          npm run typecheck
          npm run build
      - name: Commit definitive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/hooks/usePetshopAdvancedCore.js src/modules/petshop/pages/EquipePage.jsx src/shared/hooks/useClients.js src/modules/petshop/pages/PetsPage.jsx test/teamCommissionHistory.test.mjs test/clientRegistrationStatus.test.mjs scripts/apply-team-history-client-status.mjs .github/workflows/apply-team-history-client-status.yml
          git commit -m "feat: add commission history and fix client registration status"
          git push origin HEAD:feat/team-history-and-client-status
