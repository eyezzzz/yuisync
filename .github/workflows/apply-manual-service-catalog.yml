name: Aplicar catálogo manual e MotoDog fora de Muriaé

on:
  push:
    branches:
      - feat/manual-service-catalog-motodog-outside

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-service-catalog-motodog-outside
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alterações integradas
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            const count = source.split(before).length - 1
            assert.equal(count, 1, `${path}: trecho esperado deve aparecer uma vez, apareceu ${count}`)
            fs.writeFileSync(path, source.replace(before, after))
          }

          function replaceRegexOnce(path, pattern, after) {
            const source = fs.readFileSync(path, 'utf8')
            const matches = source.match(pattern)
            assert.equal(matches?.length || 0, 1, `${path}: padrão esperado não foi encontrado de forma única`)
            fs.writeFileSync(path, source.replace(pattern, after))
          }

          const agenda = 'src/modules/petshop/pages/AgendaPage.jsx'
          replaceOnce(
            agenda,
            '            {appt.notes && <p className="yuisync-card-instructions mt-1 line-clamp-3 whitespace-pre-wrap rounded-md border border-amber-500/20 bg-amber-500/8 px-2 py-1 text-[10px] text-amber-100"><strong>Instruções:</strong> {appt.notes}</p>}\n',
            '',
          )
          replaceOnce(
            agenda,
            '                  <option value="buscar_e_levar">MotoDog - buscar e levar</option>\n',
            '                  <option value="buscar_e_levar">MotoDog - buscar e levar</option>\n                  <option value="buscar_e_levar_fora_muriae">MotoDog - buscar e levar (fora de Muriaé)</option>\n',
          )

          const appointmentOperational = 'src/modules/petshop/lib/appointmentOperational.js'
          replaceOnce(
            appointmentOperational,
            "  return ['buscar_e_levar', 'somente_buscar', 'somente_levar', 'motodog'].includes(normalize(mode))",
            "  return ['buscar_e_levar', 'buscar_e_levar_fora_muriae', 'somente_buscar', 'somente_levar', 'motodog'].includes(normalize(mode))",
          )
          replaceOnce(
            appointmentOperational,
            "  if (normalized === 'buscar_e_levar') return 'MotoDog — buscar e levar'\n",
            "  if (normalized === 'buscar_e_levar') return 'MotoDog — buscar e levar'\n  if (normalized === 'buscar_e_levar_fora_muriae') return 'MotoDog — buscar e levar (fora de Muriaé)'\n",
          )

          const agendaCore = 'src/modules/petshop/pages/agendaOperationalCore.js'
          replaceOnce(
            agendaCore,
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: 20, active: true },\n",
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: 20, active: true },\n  { id: 'buscar_e_levar_fora_muriae', label: 'Buscar e levar (fora de Muriaé)', fee: 30, active: true },\n",
          )
          replaceOnce(
            agendaCore,
            "  const source = configured.length > 0 ? configured : DEFAULT_TRANSPORT_OPTIONS\n  return source.map((option, index) => ({\n",
            "  const defaultIds = new Set(DEFAULT_TRANSPORT_OPTIONS.map((option) => option.id))\n  const configuredById = new Map(configured.map((option) => [String(option?.id || ''), option]))\n  const source = [\n    ...DEFAULT_TRANSPORT_OPTIONS.map((option) => ({ ...option, ...(configuredById.get(option.id) || {}) })),\n    ...configured.filter((option) => !defaultIds.has(String(option?.id || ''))),\n  ]\n  return source.map((option, index) => ({\n",
          )

          const settings = 'src/shared/pages/SettingsPage.jsx'
          replaceOnce(
            settings,
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: '20.00', maxWeightKg: '10', active: true },\n",
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: '20.00', maxWeightKg: '10', active: true },\n  { id: 'buscar_e_levar_fora_muriae', label: 'Buscar e levar (fora de Muriaé)', fee: '30.00', maxWeightKg: '10', active: true },\n",
          )
          replaceOnce(
            settings,
            "\\n💰 **[SOMENTE_LEVAR]**',\n  veterinary_consultation:",
            "\\n💰 **[SOMENTE_LEVAR]**\\n\\n**Buscar e levar (fora de Muriaé)**\\nPets de até 10 kg\\n💰 **[BUSCAR_E_LEVAR_FORA_MURIAE]**',\n  veterinary_consultation:",
          )
          replaceOnce(
            settings,
            `function normalizeTransportOptions(value) {
  const rows = Array.isArray(value) && value.length ? value : DEFAULT_PET_TRANSPORT_OPTIONS
  return rows.map((item, index) => ({
    id: item.id || DEFAULT_PET_TRANSPORT_OPTIONS[index]?.id || \`opcao_\${index + 1}\`,
    label: item.label || DEFAULT_PET_TRANSPORT_OPTIONS[index]?.label || \`Opcao \${index + 1}\`,
    fee: String(item.fee ?? DEFAULT_PET_TRANSPORT_OPTIONS[index]?.fee ?? '0.00'),
    maxWeightKg: String(item.maxWeightKg ?? item.max_weight_kg ?? DEFAULT_PET_TRANSPORT_OPTIONS[index]?.maxWeightKg ?? '10'),
    active: item.active !== false,
  }))
}`,
            `function normalizeTransportOptions(value) {
  const configured = Array.isArray(value) ? value : []
  const defaultIds = new Set(DEFAULT_PET_TRANSPORT_OPTIONS.map((item) => item.id))
  const configuredById = new Map(configured.map((item) => [String(item?.id || ''), item]))
  const rows = [
    ...DEFAULT_PET_TRANSPORT_OPTIONS.map((item) => ({ ...item, ...(configuredById.get(item.id) || {}) })),
    ...configured.filter((item) => !defaultIds.has(String(item?.id || ''))),
  ]
  return rows.map((item, index) => ({
    id: item.id || \`opcao_\${index + 1}\`,
    label: item.label || \`Opcao \${index + 1}\`,
    fee: String(item.fee ?? '0.00'),
    maxWeightKg: String(item.maxWeightKg ?? item.max_weight_kg ?? '10'),
    active: item.active !== false,
  }))
}`,
          )

          const guard = 'server/lib/petbotGuard.js'
          replaceOnce(
            guard,
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: 20, maxWeightKg: 10, active: true },\n",
            "  { id: 'buscar_e_levar', label: 'Buscar e levar', fee: 20, maxWeightKg: 10, active: true },\n  { id: 'buscar_e_levar_fora_muriae', label: 'Buscar e levar (fora de Muriaé)', fee: 30, maxWeightKg: 10, active: true },\n",
          )
          replaceOnce(
            guard,
            "\\n💰 **[SOMENTE_LEVAR]**',\n  veterinary_consultation:",
            "\\n💰 **[SOMENTE_LEVAR]**\\n\\n**Buscar e levar (fora de Muriaé)**\\nPets de até 10 kg\\n💰 **[BUSCAR_E_LEVAR_FORA_MURIAE]**',\n  veterinary_consultation:",
          )
          replaceRegexOnce(
            guard,
            /function normalizeTransportOptions\(settings = \{\}\) \{[\s\S]*?\n\}\n\nfunction transportOptionLine/,
            `function normalizeTransportOptions(settings = {}) {
  let raw = settings.petTransportOptions || settings.pet_transport_options || null
  if (typeof raw === 'string') {
    try {
      raw = JSON.parse(raw)
    } catch {
      raw = null
    }
  }
  const configured = Array.isArray(raw) ? raw : []
  const defaultIds = new Set(DEFAULT_PET_TRANSPORT_OPTIONS.map((option) => option.id))
  const configuredById = new Map(configured.map((option) => [clean(option?.id || option?.mode), option]))
  const source = [
    ...DEFAULT_PET_TRANSPORT_OPTIONS.map((option) => ({ ...option, ...(configuredById.get(option.id) || {}) })),
    ...configured.filter((option) => !defaultIds.has(clean(option?.id || option?.mode))),
  ]
  const normalized = source
    .map((option, index) => ({
      id: clean(option.id || option.mode || DEFAULT_PET_TRANSPORT_OPTIONS[index]?.id || \`opcao_\${index + 1}\`),
      label: clean(option.label || option.name || DEFAULT_PET_TRANSPORT_OPTIONS[index]?.label || \`Opcao \${index + 1}\`),
      fee: Number(option.fee ?? option.price ?? DEFAULT_PET_TRANSPORT_OPTIONS[index]?.fee ?? settings.petTransportFee ?? DEFAULT_PET_TRANSPORT_FEE),
      maxWeightKg: option.maxWeightKg ?? option.max_weight_kg ?? DEFAULT_PET_TRANSPORT_OPTIONS[index]?.maxWeightKg ?? 10,
      active: option.active !== false,
    }))
    .filter((option) => option.active && option.id && option.label && Number.isFinite(option.fee))

  if (normalized.length) return normalized
  return [{
    id: 'buscar_e_levar',
    label: 'Buscar e levar',
    fee: Number(settings.petTransportFee ?? DEFAULT_PET_TRANSPORT_FEE),
    maxWeightKg: 10,
    active: true,
  }]
}

function transportOptionLine`,
          )
          replaceOnce(
            guard,
            "    SOMENTE_LEVAR: money(byId.get('somente_levar')?.fee ?? options[2]?.fee),\n",
            "    SOMENTE_LEVAR: money(byId.get('somente_levar')?.fee ?? options[2]?.fee),\n    BUSCAR_E_LEVAR_FORA_MURIAE: money(byId.get('buscar_e_levar_fora_muriae')?.fee ?? 30),\n",
          )
          replaceOnce(guard, "  const numeric = lower.match(/\\b([123])\\b/)", "  const numeric = lower.match(/\\b([1-9])\\b/)")
          replaceOnce(
            guard,
            "  if (/(buscar|busca).*(levar|entregar|entrega|trazer|volta)|ida.*volta|leva.*traz/.test(lower)) {\n",
            "  if (/fora (?:de )?muriae|outra cidade|fora da cidade/.test(lower)) {\n    return options.find((option) => option.id === 'buscar_e_levar_fora_muriae') || null\n  }\n  if (/(buscar|busca).*(levar|entregar|entrega|trazer|volta)|ida.*volta|leva.*traz/.test(lower)) {\n",
          )

          const ai = 'server/lib/petbotAi.js'
          replaceOnce(
            ai,
            "const SERVICE_TRANSPORT_MODES = new Set(['cliente_leva', 'motodog', 'buscar_e_levar', 'somente_buscar', 'somente_levar'])",
            "const SERVICE_TRANSPORT_MODES = new Set(['cliente_leva', 'motodog', 'buscar_e_levar', 'buscar_e_levar_fora_muriae', 'somente_buscar', 'somente_levar'])",
          )
          replaceOnce(
            ai,
            "  if (/(?:buscar_e_levar|busca_e_leva|buscar_e_trazer|ida_e_volta|levar_e_buscar)/.test(normalized)) return 'buscar_e_levar'\n",
            "  if (/(?:buscar_e_levar_fora_muriae|fora_de_muriae|fora_muriae)/.test(normalized)) return 'buscar_e_levar_fora_muriae'\n  if (/(?:buscar_e_levar|busca_e_leva|buscar_e_trazer|ida_e_volta|levar_e_buscar)/.test(normalized)) return 'buscar_e_levar'\n",
          )
          replaceOnce(
            ai,
            'normalize service_transport_mode como buscar_e_levar, somente_buscar ou somente_levar.',
            'normalize service_transport_mode como buscar_e_levar, buscar_e_levar_fora_muriae, somente_buscar ou somente_levar.',
          )
          replaceOnce(
            ai,
            'como primeira, segunda ou terceira,',
            'como primeira, segunda, terceira ou quarta,',
          )
          replaceOnce(
            ai,
            "enum: ['cliente_leva', 'motodog', 'buscar_e_levar', 'somente_buscar', 'somente_levar', null]",
            "enum: ['cliente_leva', 'motodog', 'buscar_e_levar', 'buscar_e_levar_fora_muriae', 'somente_buscar', 'somente_levar', null]",
          )

          const agent = 'server/lib/petbotAgent.js'
          replaceRegexOnce(
            agent,
            /function normalizeTransportOptions\(settings = \{\}\) \{[\s\S]*?\n\}\n\nexport function listPetTransportOptions/,
            `function normalizeTransportOptions(settings = {}) {
  const configured = Array.isArray(settings.petTransportOptions)
    ? settings.petTransportOptions
    : Array.isArray(settings.pet_transport_options) ? settings.pet_transport_options : []
  const defaults = [
    { id: 'buscar_e_levar', label: 'Buscar e levar', fee: Number(settings.petTransportFee ?? settings.pet_transport_fee ?? 20), active: true },
    { id: 'buscar_e_levar_fora_muriae', label: 'Buscar e levar (fora de Muriaé)', fee: 30, active: true },
    { id: 'somente_buscar', label: 'Somente buscar', fee: 15, active: true },
    { id: 'somente_levar', label: 'Somente levar', fee: 15, active: true },
  ]
  const defaultIds = new Set(defaults.map((option) => option.id))
  const configuredById = new Map(configured.map((option) => [clean(option?.id || option?.mode), option]))
  const source = [
    ...defaults.map((option) => ({ ...option, ...(configuredById.get(option.id) || {}) })),
    ...configured.filter((option) => !defaultIds.has(clean(option?.id || option?.mode))),
  ]
  return source
    .map((option, index) => ({
      id: clean(option.id || option.mode || \`opcao_\${index + 1}\`),
      label: clean(option.label || option.name || \`Opção \${index + 1}\`),
      fee: Number(option.fee ?? option.price ?? 0),
      active: option.active !== false,
    }))
    .filter((option) => option.active && option.id && option.label && Number.isFinite(option.fee) && option.fee >= 0)
}

export function listPetTransportOptions`,
          )

          const chat = 'server/lib/chat.js'
          replaceOnce(
            chat,
            "  if (/\\b(?:buscar e levar|busca e leva|buscar e trazer|ida e volta|levar e buscar)\\b/.test(answer)) return 'buscar_e_levar'\n",
            "  if (/\\bfora (?:de )?muriae\\b/.test(answer) && /\\b(?:buscar|busca|levar|trazer|motodog)\\b/.test(answer)) return 'buscar_e_levar_fora_muriae'\n  if (/\\b(?:buscar e levar|busca e leva|buscar e trazer|ida e volta|levar e buscar)\\b/.test(answer)) return 'buscar_e_levar'\n",
          )
          replaceOnce(
            chat,
            "  if (selectingMotodogOption && /^(?:3|terceira|terceiro|terceira opcao|opcao 3|levar)$/.test(answer)) return 'somente_levar'\n",
            "  if (selectingMotodogOption && /^(?:3|terceira|terceiro|terceira opcao|opcao 3|levar)$/.test(answer)) return 'somente_levar'\n  if (selectingMotodogOption && /^(?:4|quarta|quarto|quarta opcao|opcao 4|fora de muriae)$/.test(answer)) return 'buscar_e_levar_fora_muriae'\n",
          )

          const delivery = 'src/modules/petshop/lib/deliveryOperations.js'
          replaceOnce(
            delivery,
            "const motodogModes = new Set(['motodog', 'buscar_e_levar', 'somente_buscar', 'somente_levar'])",
            "const motodogModes = new Set(['motodog', 'buscar_e_levar', 'buscar_e_levar_fora_muriae', 'somente_buscar', 'somente_levar'])",
          )

          const advanced = 'src/modules/petshop/hooks/usePetshopAdvanced.js'
          replaceOnce(
            advanced,
            "const VALID_SERVICE_GROUPS = new Set(['banho_tosa', 'veterinaria', 'outro'])",
            "const VALID_SERVICE_GROUPS = new Set(['banho_tosa', 'veterinaria', 'motoboy', 'outro'])",
          )
          replaceOnce(
            advanced,
            "  if (/vet|veterin|consulta|vacina|clinica|medico|exame|cirurg|ultrassom|castr|retorno|internac|curativo|vermifug|microchip|aplicacao|hemograma|radiograf|raio[ -]?x|coleta|sorolog|odontolog|anestesia|medicacao|eletrocard|ecocard|emergencia|procedimento/.test(text)) return 'veterinaria'\n",
            "  if (/motodog|moto dog|motoboy|entrega|transporte|retirada|buscar|levar|delivery|frete/.test(text)) return 'motoboy'\n  if (/vet|veterin|consulta|vacina|clinica|medico|exame|cirurg|ultrassom|castr|retorno|internac|curativo|vermifug|microchip|aplicacao|hemograma|radiograf|raio[ -]?x|coleta|sorolog|odontolog|anestesia|medicacao|eletrocard|ecocard|emergencia|procedimento/.test(text)) return 'veterinaria'\n",
          )
          replaceOnce(
            advanced,
            "            groupType === 'veterinaria'\n              ? 'stethoscope'\n              : groupType === 'banho_tosa' ? 'droplets' : 'paw'\n",
            "            groupType === 'veterinaria'\n              ? 'stethoscope'\n              : groupType === 'banho_tosa'\n                ? 'droplets'\n                : groupType === 'motoboy' ? 'bike' : 'paw'\n",
          )

          const modules = 'src/config/modules.jsx'
          replaceOnce(
            modules,
            "const PlanosPage = lazy(() => import('../modules/petshop/pages/PlanosCheckoutIntegratedPage'))\n",
            "const PlanosPage = lazy(() => import('../modules/petshop/pages/PlanosCheckoutIntegratedPage'))\nconst ServicosPage = lazy(() => import('../modules/petshop/pages/ServicosPage'))\n",
          )
          replaceOnce(
            modules,
            "          { id: 'estoque', label: 'Estoque', icon: Package, roles: ['admin_pet'] },\n",
            "          { id: 'estoque', label: 'Estoque', icon: Package, roles: ['admin_pet'] },\n          { id: 'servicos', label: 'Serviços', icon: ClipboardList, roles: ['admin_pet'] },\n",
          )
          replaceOnce(
            modules,
            "      estoque: EstoquePage,\n",
            "      estoque: EstoquePage,\n      servicos: ServicosPage,\n",
          )

          const migration = 'supabase/migrations/20260803101500_petshop_manual_services_and_outside_motodog.sql'
          replaceOnce(
            migration,
            'begin;\n\n',
            `begin;

alter table public.appointments
  drop constraint if exists appointments_transport_mode_check;

alter table public.appointments
  add constraint appointments_transport_mode_check
  check (
    transport_mode is null
    or transport_mode in (
      'cliente_leva', 'motodog', 'buscar_e_levar',
      'buscar_e_levar_fora_muriae', 'somente_buscar', 'somente_levar'
    )
  );

`,
          )

          const historyTest = 'test/clientHistoryNativeAndInstructions.test.mjs'
          replaceOnce(
            historyTest,
            "  assert.match(agenda, /<strong>Instruções:<\\/strong>/)\n",
            "  assert.doesNotMatch(agenda, /yuisync-card-instructions/)\n  assert.match(agenda, /row\\('Obs\\.', appt\\.notes/)\n",
          )
          NODE

      - name: Instalar dependências
        run: npm ci

      - name: Testar regressões relacionadas
        run: node --test test/manualServiceCatalogAndMotodogOutside.test.mjs test/clientHistoryNativeAndInstructions.test.mjs test/petbotStatic.test.mjs

      - name: Validar build
        run: npm run build

      - name: Publicar branch validada
        run: |
          rm -f .github/workflows/apply-manual-service-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar catálogo manual e MotoDog fora de Muriaé"
          git push origin HEAD:feat/manual-service-catalog-motodog-outside
