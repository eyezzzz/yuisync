name: Apply package checkout reconciliation from PR

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/package-checkout-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute embedded patch
        shell: bash
        run: |
          python3 <<'RUNNER'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-package-checkout-fix.yml').read_text()
          marker = "python3 <<'PY'\n"
          if marker not in workflow or "\n          PY\n" not in workflow:
              raise RuntimeError('Embedded patch not found')
          script = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          exec(compile(textwrap.dedent(script), 'embedded-package-checkout-fix.py', 'exec'))
          RUNNER

          node --test test/agendaCompletionFinancialCheckout.test.mjs test/agendaPrintCleanup.test.mjs

      - name: Commit final patch
        shell: bash
        run: |
          rm -f .github/workflows/apply-package-checkout-fix.yml
          rm -f .github/workflows/apply-package-checkout-fix-pr.yml
          git config user.name "YuiSync Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconciliar pacote no fechamento do atendimento"
          git push origin HEAD:${{ github.head_ref }}
