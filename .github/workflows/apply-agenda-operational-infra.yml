name: Apply Agenda Operational Infrastructure

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/agenda-capacity-operational-commissions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize applicator anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agenda_path = Path('src/modules/petshop/pages/AgendaPage.jsx')
          agenda = agenda_path.read_text(encoding='utf-8')
          before_time = "time: `${String(hour).padStart(2, '0')}:00`,"
          after_time = 'time: `${String(hour).padStart(2, "0")}:00`,'
          if before_time not in agenda:
              raise SystemExit('Ancora do horario manual nao encontrada.')
          agenda_path.write_text(agenda.replace(before_time, after_time, 1), encoding='utf-8')

          script_path = Path('scripts/apply-agenda-operational-infra.mjs')
          script = script_path.read_text(encoding='utf-8')
          replacements = {
              r"assert.match(migration, /revenue \* 0\\.10/)": "assert.ok(migration.includes('revenue * 0.10'))",
              r"assert.match(migration, /revenue \* 0\\.05/)": "assert.ok(migration.includes('revenue * 0.05'))",
              r"assert.match(agenda, /Vaga \{laneIndex \+ 1\} disponivel/)": "assert.ok(agenda.includes('Vaga {laneIndex + 1} disponivel'))",
              r"assert.match(advanced, /is\('responsible_staff_key', null\)/)": "assert.ok(advanced.includes(\".is('responsible_staff_key', null)\"))",
          }
          for before, after in replacements.items():
              if before not in script:
                  raise SystemExit(f'Ancora de teste nao encontrada: {before}')
              script = script.replace(before, after, 1)
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Apply infrastructure patch
        id: applicator
        continue-on-error: true
        shell: bash
        run: node scripts/apply-agenda-operational-infra.mjs > /tmp/agenda-applicator.log 2>&1

      - name: Report applicator failure
        if: steps.applicator.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Falha do aplicador da infraestrutura da agenda'
            echo
            echo '```text'
            tail -n 60 /tmp/agenda-applicator.log
            echo '```'
          } > /tmp/agenda-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file /tmp/agenda-comment.md

      - name: Stop after applicator failure
        if: steps.applicator.outcome == 'failure'
        run: exit 1

      - name: Show applicator result
        if: steps.applicator.outcome == 'success'
        run: cat /tmp/agenda-applicator.log

      - name: Setup Node
        if: steps.applicator.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.applicator.outcome == 'success'
        run: npm ci

      - name: Run focused tests
        id: focused
        if: steps.applicator.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: node --test test/agendaOperationalInfrastructure.test.mjs > /tmp/agenda-focused-tests.log 2>&1

      - name: Report focused test failure
        if: steps.focused.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Falha dos testes focados da agenda'
            echo
            echo '```text'
            tail -n 60 /tmp/agenda-focused-tests.log
            echo '```'
          } > /tmp/agenda-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file /tmp/agenda-comment.md

      - name: Stop after focused test failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Typecheck
        if: steps.applicator.outcome == 'success' && steps.focused.outcome == 'success'
        run: npm run typecheck

      - name: Build
        if: steps.applicator.outcome == 'success' && steps.focused.outcome == 'success'
        run: npm run build

      - name: Publish applied changes and remove applicator
        if: steps.applicator.outcome == 'success' && steps.focused.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-agenda-operational-infra.yml scripts/apply-agenda-operational-infra.mjs
          git add \
            package.json \
            src/modules/petshop/pages/AgendaPage.jsx \
            src/modules/petshop/hooks/usePetshopAdvanced.js \
            src/shared/hooks/useAppointments.js \
            test/agendaOperationalInfrastructure.test.mjs \
            database/agenda_capacity_operational_commissions.sql
          git diff --cached --quiet && { echo "Nenhuma alteracao produzida."; exit 1; }
          git commit -m "feat: add two-slot agenda and operational commissions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
