name: Apply Agenda Operational Infrastructure

on:
  push:
    branches:
      - feat/agenda-capacity-operational-commissions
    paths:
      - '.github/workflows/apply-agenda-operational-infra.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run agenda operational infrastructure applicator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/agenda-capacity-operational-commissions
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply infrastructure patch
        run: node scripts/apply-agenda-operational-infra.mjs

      - name: Run focused tests
        run: node --test test/agendaOperationalInfrastructure.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish applied changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            src/modules/petshop/pages/AgendaPage.jsx \
            src/modules/petshop/hooks/usePetshopAdvanced.js \
            src/shared/hooks/useAppointments.js \
            test/agendaOperationalInfrastructure.test.mjs \
            database/agenda_capacity_operational_commissions.sql
          git diff --cached --quiet && { echo "Nenhuma alteracao produzida."; exit 1; }
          git commit -m "feat: add two-slot agenda and operational commissions"
          git push origin HEAD:feat/agenda-capacity-operational-commissions
