name: Apply Agenda Operational Infrastructure

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/agenda-capacity-operational-commissions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize applicator anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/petshop/pages/AgendaPage.jsx')
          source = path.read_text(encoding='utf-8')
          before = "time: `${String(hour).padStart(2, '0')}:00`,"
          after = 'time: `${String(hour).padStart(2, "0")}:00`,'
          if before not in source:
              raise SystemExit('Ancora do horario manual nao encontrada.')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Apply infrastructure patch
        id: applicator
        continue-on-error: true
        shell: bash
        run: node scripts/apply-agenda-operational-infra.mjs > /tmp/agenda-applicator.log 2>&1

      - name: Report applicator failure
        if: steps.applicator.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Falha do aplicador da infraestrutura da agenda'
            echo
            echo '```text'
            cat /tmp/agenda-applicator.log
            echo '```'
          } > /tmp/agenda-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/agenda-comment.md

      - name: Stop after applicator failure
        if: steps.applicator.outcome == 'failure'
        run: exit 1

      - name: Show applicator result
        if: steps.applicator.outcome == 'success'
        run: cat /tmp/agenda-applicator.log

      - name: Setup Node
        if: steps.applicator.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.applicator.outcome == 'success'
        run: npm ci

      - name: Run focused tests
        if: steps.applicator.outcome == 'success'
        run: node --test test/agendaOperationalInfrastructure.test.mjs

      - name: Typecheck
        if: steps.applicator.outcome == 'success'
        run: npm run typecheck

      - name: Build
        if: steps.applicator.outcome == 'success'
        run: npm run build

      - name: Publish applied changes and remove applicator
        if: steps.applicator.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-agenda-operational-infra.yml scripts/apply-agenda-operational-infra.mjs
          git add \
            package.json \
            src/modules/petshop/pages/AgendaPage.jsx \
            src/modules/petshop/hooks/usePetshopAdvanced.js \
            src/shared/hooks/useAppointments.js \
            test/agendaOperationalInfrastructure.test.mjs \
            database/agenda_capacity_operational_commissions.sql
          git diff --cached --quiet && { echo "Nenhuma alteracao produzida."; exit 1; }
          git commit -m "feat: add two-slot agenda and operational commissions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
