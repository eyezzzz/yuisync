name: Apply PR96 package recurring migration

on:
  push:
    branches:
      - feat/package-recurring-agenda
    paths:
      - supabase/migrations/20260731174500_petshop_package_recurring_appointments.sql
      - .github/workflows/apply-pr96-package-recurring-migration.yml
      - .github/pr96-migration-trigger.txt

permissions:
  contents: write

concurrency:
  group: pr96-package-recurring-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIGRATION_FILE: supabase/migrations/20260731174500_petshop_package_recurring_appointments.sql
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/package-recurring-agenda
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: credentials
        name: Verify database credentials
        continue-on-error: true
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN ausente"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "SUPABASE_PROJECT_REF ausente"; exit 1; }

      - id: backup
        name: Verify a managed backup exists
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node scripts/supabase-management.mjs backups > /tmp/supabase-backups.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/supabase-backups.json','utf8')); if (!Array.isArray(data) || data.length === 0) throw new Error('Nenhum backup gerenciado encontrado antes da migration'); console.log('Backups encontrados:', data.length)"

      - id: dry_run
        name: Dry-run migration
        if: steps.credentials.outcome == 'success' && steps.backup.outcome == 'success'
        continue-on-error: true
        run: node scripts/supabase-management.mjs check "$MIGRATION_FILE"

      - id: apply
        name: Apply migration
        if: steps.dry_run.outcome == 'success'
        continue-on-error: true
        run: node scripts/supabase-management.mjs migrate "$MIGRATION_FILE"

      - name: Record migration outcome
        if: always()
        shell: bash
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          BACKUP_OUTCOME: ${{ steps.backup.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          mkdir -p docs/migration-receipts
          HASH="$(sha256sum "$MIGRATION_FILE" | awk '{print $1}')"
          RECORDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          STATUS="failed"
          if [ "$APPLY_OUTCOME" = "success" ]; then STATUS="applied"; fi
          cat > docs/migration-receipts/20260731174500_petshop_package_recurring_appointments.json <<EOF
          {
            "migration": "20260731174500_petshop_package_recurring_appointments",
            "sha256": "$HASH",
            "status": "$STATUS",
            "recorded_at": "$RECORDED_AT",
            "source_commit": "${GITHUB_SHA}",
            "checks": {
              "credentials": "$CREDENTIALS_OUTCOME",
              "managed_backup": "$BACKUP_OUTCOME",
              "dry_run": "$DRY_RUN_OUTCOME",
              "apply": "$APPLY_OUTCOME"
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/migration-receipts/20260731174500_petshop_package_recurring_appointments.json
          git commit -m "Registrar resultado da migration recorrente da PR96"
          git push origin HEAD:feat/package-recurring-agenda
          test "$STATUS" = "applied"
