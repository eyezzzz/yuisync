name: Fix PetBot public label assertion

on:
  pull_request:
    paths:
      - '.github/workflows/fix-petbot-public-label-assertion.yml'
      - 'docs/fix-petbot-public-label-assertion-trigger.md'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/petbot-500-hypothetical-scenarios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch assertion and clean temporary files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/petbotAgent.test.mjs')
          source = path.read_text()
          old = "  assert.doesNotMatch(prepared.summary, /10,1 A 22 KG|Pelo Duplo|Pagamento:/i)"
          new = """  const publicServiceLines = prepared.summary
            .split('\\n')
            .filter((line) => /(?:1x|Serviço:)/i.test(line))
            .join('\\n')
          assert.doesNotMatch(publicServiceLines, /10,1 A 22 KG|Pelo Duplo/i)
          assert.doesNotMatch(prepared.summary, /Pagamento:/i)"""
          if old not in source:
              raise SystemExit('Target assertion not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-petbot-public-label-assertion.yml
          rm -f docs/fix-petbot-public-label-assertion-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/petbotAgent.test.mjs .github/workflows/fix-petbot-public-label-assertion.yml docs/fix-petbot-public-label-assertion-trigger.md
          git commit -m 'test: scope public service label assertion'
          git push origin HEAD:${{ github.head_ref }}
