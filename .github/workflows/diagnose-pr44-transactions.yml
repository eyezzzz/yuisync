name: Diagnose PR 44 transaction tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture transaction tests
        shell: bash
        run: |
          set +e
          npm run test:transactions > /tmp/pr44-transactions.log 2>&1
          status=$?
          cp /tmp/pr44-transactions.log .github/pr44-transactions.log
          rm .github/workflows/diagnose-pr44-transactions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record PR 44 transaction test output"
          git push origin HEAD:${{ github.head_ref }}
          exit "$status"
