name: Apply multi-pet package allocation

on:
  push:
    branches:
      - feat/multi-pet-package-allocation

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rebuild and apply prepared patch
        shell: bash
        run: |
          cat .github/patches/multi-pet.xz00 \
              .github/patches/multi-pet.xz01 \
              .github/patches/multi-pet.xz02 \
              .github/patches/multi-pet.xz03 \
              .github/patches/multi-pet.xz04 > /tmp/yuisync-multi-pet.patch.xz.b64
          base64 --decode /tmp/yuisync-multi-pet.patch.xz.b64 > /tmp/yuisync-multi-pet.patch.xz
          xz --decompress --stdout /tmp/yuisync-multi-pet.patch.xz > /tmp/yuisync-multi-pet.patch
          echo "424f6c67c91fec9b291d057b7bc790fa9c4eb7137fb71601c471779a3cdc2b86  /tmp/yuisync-multi-pet.patch" | sha256sum --check
          git apply --check --whitespace=error-all /tmp/yuisync-multi-pet.patch
          git apply --whitespace=error-all /tmp/yuisync-multi-pet.patch
          rm -f .github/patches/multi-pet.part00
          rm -f .github/patches/multi-pet.xz00 .github/patches/multi-pet.xz01 .github/patches/multi-pet.xz02 .github/patches/multi-pet.xz03 .github/patches/multi-pet.xz04
          rm -f .github/workflows/apply-multi-pet-package.yml
          rmdir .github/patches 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Multi-pet regression tests
        run: node --test test/multiPetPackages.test.mjs

      - name: General tests
        run: npm run test

      - name: Transaction tests
        run: npm run test:transactions

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: support multiple pets and package balances"
          git push origin HEAD:feat/multi-pet-package-allocation
