name: Apply pet team delivery improvements

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/pet-cards-commissions-motoboy
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        run: python3 scripts/apply-pet-team-delivery-improvements.py

      - name: Preserve commission compatibility labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/petshop/pages/EquipePage.jsx')
          content = path.read_text()

          old_rates = 'Tosa na maquina, total ou tesoura recebe 10%. Banho e outros servicos esteticos recebem 5%.'
          new_rates = 'Tosa 10%: maquina, total ou tesoura. Banho 5%. Outros 5%. MotoDog, transporte e entrega ficam fora deste calculo.'
          if old_rates not in content:
              raise SystemExit('Texto das taxas de comissao nao encontrado.')
          content = content.replace(old_rates, new_rates, 1)

          old_button = '<button type="button" onClick={() => setHistoryRow(row)} className="btn btn-secondary btn-sm"><Eye size={13}/> Conferir</button>'
          new_button = '<button type="button" title="Visualizar e imprimir historico" aria-label="Visualizar e imprimir historico" onClick={() => setHistoryRow(row)} className="btn btn-secondary btn-sm"><Eye size={13}/> Conferir</button>'
          if old_button not in content:
              raise SystemExit('Botao de conferencia nao encontrado.')
          content = content.replace(old_button, new_button, 1)

          old_total = '<tfoot><tr><td colSpan={4} className="font-bold text-text">Totais</td>'
          new_total = '<tfoot><tr><td colSpan={4} className="font-bold text-text">Total conferido</td>'
          if old_total not in content:
              raise SystemExit('Total do historico nao encontrado.')
          content = content.replace(old_total, new_total, 1)

          path.write_text(content)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regressions
        run: node --test test/teamDeliveryAndCommissionSummary.test.mjs test/teamCommissionHistory.test.mjs test/agendaOperationalInfrastructure.test.mjs test/multiPetPackages.test.mjs

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aprimorar pets, comissoes e entregas operacionais"
          git push origin HEAD:agent/pet-cards-commissions-motoboy
