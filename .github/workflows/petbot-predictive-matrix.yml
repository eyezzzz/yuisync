name: PetBot Predictive Matrix

on:
  pull_request:
    paths:
      - 'test/petbotPredictive100x.test.mjs'
      - 'server/lib/petbotAgent.js'
      - 'shared/petshopOperations.js'
      - 'package.json'
      - '.github/workflows/petbot-predictive-matrix.yml'
  workflow_dispatch:

jobs:
  predictive-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:petbot:predictive
