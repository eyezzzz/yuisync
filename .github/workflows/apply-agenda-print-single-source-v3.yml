name: Apply agenda print single source v3

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/agenda-print-single-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run corrected embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/apply-agenda-print-single-source.yml')
          workflow = workflow_path.read_text()
          old = "          resolved = replace_once(resolved, 'font-size: 12px; font-weight: 900;', 'font-size: 13px; font-weight: 900;', 'increase receipt title')"
          new = "          resolved = replace_once(resolved, '          .title { margin: 3mm 0 2mm; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 1.6mm 0; font-size: 12px; font-weight: 900; }\\n', '          .title { margin: 3mm 0 2mm; border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 1.6mm 0; font-size: 13px; font-weight: 900; }\\n', 'increase receipt title')"
          if workflow.count(old) != 1:
              raise RuntimeError(f'expected title replacement once, found {workflow.count(old)}')
          workflow = workflow.replace(old, new, 1)

          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<agenda-print-patch>', 'exec'), {})
          PY

      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm .github/workflows/apply-agenda-print-single-source.yml
          rm .github/workflows/apply-agenda-print-single-source-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/pages/AgendaBookingEnhancements.jsx src/modules/petshop/pages/AgendaResolvedPage.jsx src/modules/petshop/pages/AgendaPage.jsx test/agendaPrintCleanup.test.mjs .github/workflows/apply-agenda-print-single-source.yml .github/workflows/apply-agenda-print-single-source-v3.yml
          git commit -m "fix: unificar impressao limpa da agenda"
          git push origin HEAD:${{ github.head_ref }}
