name: Finalizar histórico nativo e observações dos pets

on:
  push:
    branches:
      - fix/native-client-history-pet-instructions
    paths:
      - scripts/finalize-native-history-pet-notes.mjs
      - .github/workflows/finalize-native-history-pet-notes.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-client-history-pet-instructions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Aplicar ajuste final
        run: node scripts/finalize-native-history-pet-notes.mjs
      - name: Executar regressões
        run: node --test test/clientHistoryNativeAndInstructions.test.mjs
      - name: Instalar dependências
        run: npm ci
      - name: Validar build
        run: npm run build
      - name: Publicar ajuste final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajustar grupos de tutores e fallback das observações"
          git push origin HEAD:fix/native-client-history-pet-instructions
