name: Apply agenda history print icon

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-history-print-icon
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply definitive patch
        run: |
          node scripts/apply-agenda-history-print-icon.mjs
          rm -f scripts/apply-agenda-history-print-icon.mjs .github/workflows/apply-agenda-history-print-icon.yml
      - name: Validate history print action
        run: |
          node --test test/agendaHistoryPrintAction.test.mjs test/agendaPrintCleanup.test.mjs
          npm run typecheck
          npm run build
      - name: Commit definitive files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: permitir reimpressao no historico da agenda"
          git push origin HEAD:fix/agenda-history-print-icon
