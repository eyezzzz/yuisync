name: Fix Agenda SQL Delimiters

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/agenda-capacity-operational-commissions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix SQL delimiters
        run: node scripts/fix-agenda-sql-delimiters.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused and transactional tests
        id: tests
        continue-on-error: true
        shell: bash
        run: npm run test:transactions > /tmp/agenda-sql-tests.log 2>&1

      - name: Report SQL test failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Falha na regressao dos delimitadores SQL'
            echo
            echo '```text'
            grep -n -B 8 -A 35 '^not ok' /tmp/agenda-sql-tests.log || tail -n 120 /tmp/agenda-sql-tests.log
            echo '```'
          } > /tmp/agenda-sql-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/agenda-sql-comment.md

      - name: Stop after SQL test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish SQL fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260727001000_agenda_capacity_operational_commissions.sql \
            database/agenda_capacity_operational_commissions.sql \
            test/agendaOperationalInfrastructure.test.mjs
          git diff --cached --quiet && { echo "Nenhuma correcao SQL produzida."; exit 1; }
          git commit -m "fix: correct agenda migration SQL delimiters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
