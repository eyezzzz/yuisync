name: Fix Agenda SQL Delimiters

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/agenda-capacity-operational-commissions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix SQL delimiters
        run: node scripts/fix-agenda-sql-delimiters.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused and transactional tests
        run: npm run test:transactions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish SQL fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260727001000_agenda_capacity_operational_commissions.sql \
            database/agenda_capacity_operational_commissions.sql \
            test/agendaOperationalInfrastructure.test.mjs
          git diff --cached --quiet && { echo "Nenhuma correcao SQL produzida."; exit 1; }
          git commit -m "fix: correct agenda migration SQL delimiters"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
