name: Apply daily agenda and staff persistence fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-daily-agenda-staff-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/daily-agenda-staff-persistence
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/apply-daily-agenda-staff-fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run test:transactions
          npm run typecheck
          npm run build

      - name: Publish fix branch
        run: |
          rm .github/apply-daily-agenda-staff-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add daily agenda and persist staff names"
          git push origin HEAD:fix/daily-agenda-staff-persistence

      - name: Remove temporary workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/apply-daily-agenda-staff-fix.yml
          git commit -m "chore: remove daily agenda fix executor"
          git push origin main
