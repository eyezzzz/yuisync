name: Patch PR 127 stale transport test

on:
  push:
    branches:
      - fix/stale-consumed-package-edit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stale-consumed-package-edit

      - name: Atualizar expectativa legada do MotoDog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/petbotAgentV3.test.mjs')
          text = path.read_text()
          old = """test('opcoes de transporte sao lidas da configuracao real da loja', () => {\n  assert.deepEqual(listPetTransportOptions({\n    petTransportFee: 999,\n    petTransportOptions: [\n      { id: 'buscar', label: 'Somente buscar', fee: 18, active: true },\n      { id: 'inativo', label: 'Inativo', fee: 1, active: false },\n    ],\n  }), [{ id: 'buscar', label: 'Somente buscar', fee: 18 }])\n})\n"""
          new = """test('opcoes de transporte preservam os padroes operacionais e a configuracao real da loja', () => {\n  assert.deepEqual(listPetTransportOptions({\n    petTransportFee: 999,\n    petTransportOptions: [\n      { id: 'buscar', label: 'Somente buscar', fee: 18, active: true },\n      { id: 'inativo', label: 'Inativo', fee: 1, active: false },\n    ],\n  }), [\n    { id: 'buscar_e_levar', label: 'Buscar e levar', fee: 999 },\n    { id: 'buscar_e_levar_fora_muriae', label: 'Buscar e levar (fora de Muriaé)', fee: 30 },\n    { id: 'somente_buscar', label: 'Somente buscar', fee: 15 },\n    { id: 'somente_levar', label: 'Somente levar', fee: 15 },\n    { id: 'buscar', label: 'Somente buscar', fee: 18 },\n  ])\n})\n"""
          if old not in text:
              raise SystemExit('Bloco de teste esperado nao foi encontrado; nenhuma alteracao aplicada.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remover workflow temporario e gravar patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-pr127-stale-transport-test.yml
          git add test/petbotAgentV3.test.mjs
          git commit -m "Atualizar regressao das opcoes MotoDog"
          git push origin HEAD:fix/stale-consumed-package-edit
