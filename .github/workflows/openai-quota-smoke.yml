name: OpenAI Quota Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/openai-quota-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
    steps:
      - name: One minimal API request
        shell: bash
        run: |
          node <<'NODE'
          const key = process.env.OPENAI_API_KEY || ''
          const model = process.env.OPENAI_MODEL || 'gpt-4o-mini'
          if (!key) throw new Error('OPENAI_API_KEY ausente')

          const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${key}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              model,
              messages: [{ role: 'user', content: 'Responda somente OK.' }],
              temperature: 0,
              max_tokens: 3,
            }),
          })
          const body = await response.json().catch(() => ({}))
          const summary = {
            http_status: response.status,
            ok: response.ok,
            model: body.model || model,
            error_type: body?.error?.type || null,
            error_code: body?.error?.code || null,
            error_message: body?.error?.message || null,
            usage: body.usage || null,
            reply: body?.choices?.[0]?.message?.content || null,
          }
          console.log(JSON.stringify(summary, null, 2))
          if (!response.ok) process.exit(1)
          NODE
