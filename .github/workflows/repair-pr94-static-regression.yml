name: Repair PR94 static regression

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.head_ref == 'fix/agenda-visual-standardization-uppercase'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update current multi-pet expectations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          test_path = Path('test/transactionalStatic.test.mjs')
          source = test_path.read_text(encoding='utf-8')
          replacements = [
              (
                  r"assert.match(source, /flex min-h-\[250px\] flex-col/)",
                  r"assert.match(source, /flex min-h-\[270px\] flex-col/)",
              ),
              (
                  r"assert.match(source, /visiblePets\.map/)",
                  r"assert.match(source, /visibleTutorGroups\.map/)",
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected legacy assertion was not found: {old}')
              source = source.replace(old, new, 1)
          test_path.write_text(source, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/repair-pr94-static-regression.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Transaction regressions
        run: npm run test:transactions

      - name: Visual standardization regressions
        run: node --test test/agendaVisualStandardization.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated correction
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizar regressao dos cards multi-pet"
          git push origin HEAD:${{ github.head_ref }}
