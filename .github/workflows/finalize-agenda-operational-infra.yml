name: Finalize Agenda Operational Infrastructure

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/agenda-capacity-operational-commissions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize final applicator anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/finalize-agenda-operational-infra.mjs')
          source = path.read_text(encoding='utf-8')
          before = "  `  assert.ok(migration.includes('calculate_petshop_operational_commissions'))`,"
          after = "  `  assert.match(migration, /calculate_petshop_operational_commissions/)`,"
          if before not in source:
              raise SystemExit('Ancora do contrato transacional nao encontrada.')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY

      - name: Apply final infrastructure patch
        id: applicator
        continue-on-error: true
        shell: bash
        run: node scripts/finalize-agenda-operational-infra.mjs > /tmp/final-agenda.log 2>&1

      - name: Report applicator failure
        if: steps.applicator.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Falha no ajuste final da agenda'
            echo
            echo '```text'
            tail -n 40 /tmp/final-agenda.log
            echo '```'
          } > /tmp/final-agenda-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/final-agenda-comment.md

      - name: Stop after applicator failure
        if: steps.applicator.outcome == 'failure'
        run: exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused tests
        run: node --test test/agendaOperationalInfrastructure.test.mjs

      - name: Transactional static tests
        run: npm run test:transactions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Publish final patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/modules/petshop/lib/appointmentOperational.js \
            src/modules/petshop/pages/AgendaPage.jsx \
            src/shared/hooks/useAppointments.js \
            supabase/migrations/20260727001000_agenda_capacity_operational_commissions.sql \
            database/agenda_capacity_operational_commissions.sql \
            test/agendaOperationalInfrastructure.test.mjs
          git diff --cached --quiet && { echo "Nenhuma alteracao final produzida."; exit 1; }
          git commit -m "fix: make agenda capacity and assignments atomic"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
