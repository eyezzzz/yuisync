      - name: Install dependencies
        run: npm ci

      - name: Validate hotfix
        run: |
          npm run test:transactions
          npm run typecheck
          npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          rm .github/workflows/apply-agenda-staff-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/pages/SettingsPage.jsx \
                  src/modules/petshop/pages/AgendaPage.jsx \
                  src/modules/petshop/pages/EquipePage.jsx \
                  supabase/migrations/20260727002000_veterinary_single_capacity.sql \
                  test/agendaStaffSettingsRegression.test.mjs \
                  .github/workflows/apply-agenda-staff-hotfix.yml
          git commit -m "fix: persist staff names and split agenda capacity"
          git push origin HEAD:fix/agenda-staff-settings-capacity
