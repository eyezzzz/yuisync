name: Apply agenda staff hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-agenda-staff-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/agenda-staff-settings-capacity
          fetch-depth: 0

      - name: Check patch and record failure
        id: patch-check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git apply --check .github/agenda-staff-hotfix.patch > /tmp/hotfix-check.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/hotfix-check.log .github/agenda-staff-hotfix-error.log
          git add .github/agenda-staff-hotfix-error.log
          git commit -m "chore: record agenda staff hotfix failure" || true
          git push origin HEAD:fix/agenda-staff-settings-capacity
          cat /tmp/hotfix-check.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: git apply .github/agenda-staff-hotfix.patch

      - name: Install dependencies
        run: npm ci

      - name: Validate hotfix
        run: |
          npm run test:transactions
          npm run typecheck
          npm run build

      - name: Publish hotfix branch
        run: |
          rm .github/workflows/apply-agenda-staff-hotfix.yml
          rm .github/agenda-staff-hotfix.patch
          rm .github/agenda-staff-trigger
          rm -f .github/agenda-staff-hotfix-error.log
          git add -A
          git commit -m "fix: persist staff names and split agenda capacity"
          git push origin HEAD:fix/agenda-staff-settings-capacity

      - name: Remove temporary executor from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/apply-agenda-staff-hotfix.yml
          git commit -m "chore: remove agenda staff hotfix executor"
          git push origin main
