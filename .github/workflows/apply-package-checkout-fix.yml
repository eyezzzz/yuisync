                  src/modules/petshop/pages/AgendaResolvedPage.jsx \
                  supabase/migrations/20260729172000_petshop_checkout_package_reconciliation.sql \
                  test/agendaCompletionFinancialCheckout.test.mjs \
                  test/agendaPrintCleanup.test.mjs \
                  .github/workflows/apply-package-checkout-fix.yml
          git commit -m "fix: reconciliar pacote no fechamento do atendimento"
          git push origin HEAD:fix/package-checkout-reconciliation
