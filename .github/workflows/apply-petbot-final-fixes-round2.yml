name: Apply PetBot Final Fixes Round 2

on:
  pull_request:
    paths:
      - scripts/apply-petbot-final-fixes-round2.mjs
      - .github/workflows/apply-petbot-final-fixes-round2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply and validate fixes
        run: |
          node --check scripts/apply-petbot-final-fixes-round2.mjs
          node scripts/apply-petbot-final-fixes-round2.mjs
          node --check server/lib/petbotGrounding.js
          node --check scripts/eval-petbot-humanized-50.mjs
          node --test test/petbotHumanizedHarness.test.mjs
          node --test test/petbotFinalRuntimeFixes.test.mjs
          node --test test/petbotSemantics.test.mjs

      - name: Remove temporary patch workflow
        run: |
          rm scripts/apply-petbot-final-fixes-round2.mjs
          rm .github/workflows/apply-petbot-final-fixes-round2.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(petbot): endurecer tools e respostas factuais da Luna"
          git push origin HEAD:test/petbot-predictive-100x
