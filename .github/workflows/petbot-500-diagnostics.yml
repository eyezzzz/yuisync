name: PetBot 500 Diagnostics

on:
  pull_request:
    paths:
      - 'test/petbotHypothetical100Each.test.mjs'
      - 'scripts/diagnose-petbot-500.mjs'
      - '.github/workflows/petbot-500-diagnostics.yml'
      - 'docs/petbot-500-diagnostics-trigger.md'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Count all 500 hypothetical scenarios
        run: node scripts/diagnose-petbot-500.mjs | tee petbot-500-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: petbot-500-results
          path: petbot-500-results.json
