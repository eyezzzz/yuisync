name: Repair PetBot Test Newlines

on:
  pull_request:
    paths:
      - '.github/workflows/fix-petbot-test-newlines.yml'
      - 'test/petbotAgent.test.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 0
      - name: Replace literal newline escapes with real lines
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/petbotAgent.test.mjs')
          lines = path.read_text().splitlines()
          replacement = [
              "  const publicServiceLines = prepared.summary",
              "    .split('\\n')",
              "    .filter((line) => /^(?:• 1x|• Serviço:)/.test(line))",
              "    .join('\\n')",
              "  assert.doesNotMatch(publicServiceLines, /10,1 A 22 KG|Pelo Duplo|Pagamento:/i)",
          ]
          for index, line in enumerate(lines):
              if line.startswith("  const publicServiceLines = prepared.summary\\n"):
                  lines[index:index + 1] = replacement
                  break
          else:
              raise SystemExit('malformed PetBot assertion line not found')
          path.write_text('\n'.join(lines) + '\n')
          Path('.github/workflows/fix-petbot-test-newlines.yml').unlink()
          PY
      - name: Verify repaired file parses
        run: node --check test/petbotAgent.test.mjs
      - name: Commit repair
        run: |
          git config user.name "yuisync-ci"
          git config user.email "actions@users.noreply.github.com"
          git add test/petbotAgent.test.mjs .github/workflows/fix-petbot-test-newlines.yml
          git commit -m "test: repair PetBot summary assertion formatting"
          git push origin HEAD:test/petbot-predictive-100x
