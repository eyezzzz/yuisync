name: Apply Agenda Free Scheduling

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/agenda-free-four-lane-dnd' || github.ref_name == 'feat/agenda-free-four-lane-dnd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agenda-free-four-lane-dnd
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/apply-agenda-free-scheduling.mjs
      - run: node --test test/agendaFreeScheduling.test.mjs test/agendaOperationalInfrastructure.test.mjs test/agendaStaffSettingsRegression.test.mjs
      - run: npm run typecheck

      - name: Commit definitive patch
        run: |
          rm scripts/apply-agenda-free-scheduling.mjs
          rm .github/workflows/apply-agenda-free-scheduling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/lib/appointmentOperational.js \
                  src/modules/petshop/pages/AgendaPage.jsx \
                  supabase/migrations/20260730095500_agenda_free_overlap_visual_lanes.sql \
                  test/agendaOperationalInfrastructure.test.mjs \
                  test/agendaStaffSettingsRegression.test.mjs \
                  test/agendaFreeScheduling.test.mjs \
                  scripts/apply-agenda-free-scheduling.mjs \
                  .github/workflows/apply-agenda-free-scheduling.yml
          git commit -m "feat: liberar sobreposicoes e ampliar agenda visual"
          git push origin HEAD:feat/agenda-free-four-lane-dnd
