name: Apply native agenda patch

on:
  push:
    branches:
      - fix/agenda-native-package-services
    paths:
      - scripts/apply_native_agenda_package_patch.py
      - .github/workflows/apply-native-agenda-patch.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_native_agenda_package_patch.py
      - .github/workflows/apply-native-agenda-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agenda-native-package-services
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relax whitespace-sensitive replacement
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_native_agenda_package_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    "                               <span className=\\"block text-xs text-muted\\">{fmtCurrency(service.price)} · {displayedDuration} min</span>\\n",',
              '    "<span className=\\"block text-xs text-muted\\">{fmtCurrency(service.price)} · {displayedDuration} min</span>\\n",',
          )
          text = text.replace(
              '    "                               <span className=\\"block text-xs text-muted\\">{packageServiceCodes.has(String(service.value)) ? \'Pacote · R$ 0,00\' : fmtCurrency(service.price)} · {displayedDuration} min</span>\\n",',
              '    "<span className=\\"block text-xs text-muted\\">{packageServiceCodes.has(String(service.value)) ? \'Pacote · R$ 0,00\' : fmtCurrency(service.price)} · {displayedDuration} min</span>\\n",',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply deterministic source patch
        run: python scripts/apply_native_agenda_package_patch.py
      - name: Commit patched Agenda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: integrar pacote e tosas nativamente na agenda"
          git push origin HEAD:fix/agenda-native-package-services
