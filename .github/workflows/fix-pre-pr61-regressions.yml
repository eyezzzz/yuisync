name: Fix Pre PR6.1 Regression Expectations

on:
  push:
    branches:
      - feat/pre-pr61-petshop-operations
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[workspace-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-pr61-petshop-operations
          fetch-depth: 0
      - name: Apply exact regression patch
        run: |
          git apply --check .github/pre-pr61-test-fix.patch
          git apply --index .github/pre-pr61-test-fix.patch
          rm -f .github/pre-pr61-test-fix.patch
          rm -f .github/workflows/pre-pr61-debug.yml
          rm -f .github/workflows/fix-pre-pr61-regressions.yml
          git add -A
          git diff --cached --check
      - name: Publish regression alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(petbot): align regressions with PR6.1 contract [workspace-ready]"
          git push origin HEAD:feat/pre-pr61-petshop-operations
