name: Validar catálogo manual e MotoDog

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-service-catalog-motodog-outside
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extrair e aplicar alterações integradas
        run: |
          awk '
            /node <<'"'"'NODE'"'"'/ { capture=1; next }
            capture && /^          NODE$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-manual-service-catalog.yml > /tmp/apply-manual-service-catalog.js
          node /tmp/apply-manual-service-catalog.js

      - name: Instalar dependências
        run: npm ci

      - name: Testar regressões relacionadas
        run: node --test test/manualServiceCatalogAndMotodogOutside.test.mjs test/clientHistoryNativeAndInstructions.test.mjs test/petbotStatic.test.mjs

      - name: Validar build
        run: npm run build

      - name: Publicar branch validada
        run: |
          rm -f .github/workflows/apply-manual-service-catalog.yml
          rm -f .github/workflows/validate-manual-service-catalog-pr.yml
          rm -f .github/manual-service-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar catálogo manual e MotoDog fora de Muriaé"
          git push origin HEAD:feat/manual-service-catalog-motodog-outside
