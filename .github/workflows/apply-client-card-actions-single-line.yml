name: Preparar correções de histórico, layout e comissão

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar correções
        run: node scripts/apply-client-card-actions-single-line.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Testar regressões envolvidas
        run: node --test test/clientHistoryNativeAndInstructions.test.mjs test/clientHistoryClickLayoutAndPackageCommission.test.mjs test/teamDeliveryAndCommissionSummary.test.mjs

      - name: Validar build
        run: npm run build

      - name: Publicar branch limpa com as correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B fix/history-layout-package-commission
          git add -A
          git commit -m "Corrigir histórico, layout dos cards e comissão de pacotes"
          git push --force-with-lease origin HEAD:fix/history-layout-package-commission
