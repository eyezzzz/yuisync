name: Apply visible multi-pet fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/multi-pet-visible-flows'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar revisão visível
        run: python .github/scripts/apply_visible_multi_pet_fix.py

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Regressões multi-pet
        run: node --test test/multiPetPackages.test.mjs

      - name: Testes gerais
        run: npm run test

      - name: Build
        run: npm run build

      - name: Remover aplicador temporário
        run: |
          rm -f .github/scripts/apply_visible_multi_pet_fix.py
          rm -f .github/workflows/apply-visible-multi-pet-fix.yml

      - name: Publicar correção na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/petshop/pages/PetsPage.jsx \
                  src/modules/petshop/pages/AgendaPage.jsx \
                  src/modules/petshop/pages/PlanosNativePage.jsx \
                  test/multiPetPackages.test.mjs \
                  .github/scripts/apply_visible_multi_pet_fix.py \
                  .github/workflows/apply-visible-multi-pet-fix.yml
          git commit -m "Expor e conectar fluxos multi-pet nas telas"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
