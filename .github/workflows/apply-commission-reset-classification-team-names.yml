name: Apply commission reset classification and team names

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/commission-reset-classification-team-names
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        run: python3 scripts/apply-commission-reset-classification-team-names.py

      - name: Remove temporary applicator
        run: |
          rm scripts/apply-commission-reset-classification-team-names.py
          rm .github/workflows/apply-commission-reset-classification-team-names.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regressions
        run: node --test test/teamDeliveryAndCommissionSummary.test.mjs test/teamCommissionHistory.test.mjs test/agendaOperationalInfrastructure.test.mjs

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir fechamento, classificacao e nomes da equipe"
          git push origin HEAD:fix/commission-reset-classification-team-names
