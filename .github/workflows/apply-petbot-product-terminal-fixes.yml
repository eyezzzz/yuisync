name: Apply PetBot Product Terminal Fixes

on:
  pull_request:
    paths:
      - scripts/apply-petbot-product-terminal-fixes.py
      - .github/workflows/apply-petbot-product-terminal-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 2
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-petbot-product-terminal-fixes.py')
          source = path.read_text(encoding='utf-8')
          start_marker = "workflow_path = '.github/workflows/petbot-final-humanized-100.yml'"
          end_marker = "test_file = r'''"
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              source = source[:start] + source[end:]
              path.write_text(source, encoding='utf-8')
          PY
          python3 scripts/apply-petbot-product-terminal-fixes.py

      - run: npm ci

      - name: Validate deterministic product paths
        run: |
          node --check server/lib/petbotProductFollowup.js
          node --check server/lib/chat.js
          node --check scripts/eval-petbot-humanized-50.mjs
          node --test test/petbotProductFollowup.test.mjs
          node --test test/petbotFinalRuntimeFixes.test.mjs
          node --test test/petbotSemantics.test.mjs
          npm run test:petbot

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add server/lib/chat.js server/lib/petbotProductFollowup.js scripts/eval-petbot-humanized-50.mjs test/petbotProductFollowup.test.mjs
          git diff --cached --stat
          git commit -m "fix(petbot): encadear preparação e imagem de produtos"
          git pull --rebase origin test/petbot-predictive-100x
          git push origin HEAD:test/petbot-predictive-100x
