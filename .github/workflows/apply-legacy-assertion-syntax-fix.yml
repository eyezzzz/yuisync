name: Apply Legacy Assertion Syntax Fix

on:
  push:
    branches:
      - test/petbot-predictive-100x

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[fix-legacy-assertion]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 0
      - name: Repair malformed multiline assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/petbotAgent.test.mjs')
          text = path.read_text()
          bad = "  const publicServiceLines = prepared.summary\\n    .split('\\n')\\n    .filter((line) => /^(?:• 1x|• Serviço:)/.test(line))\\n    .join('\\n')\\n  assert.doesNotMatch(publicServiceLines, /10,1 A 22 KG|Pelo Duplo|Pagamento:/i)"
          good = """  const publicServiceLines = prepared.summary
    .split('\\n')
    .filter((line) => /^(?:• 1x|• Serviço:)/.test(line))
    .join('\\n')
  assert.doesNotMatch(publicServiceLines, /10,1 A 22 KG|Pelo Duplo|Pagamento:/i)"""
          if bad not in text:
              raise SystemExit('malformed assertion pattern not found')
          path.write_text(text.replace(bad, good, 1))
          Path('.github/workflows/apply-legacy-assertion-syntax-fix.yml').unlink()
          PY
      - name: Commit syntax repair
        run: |
          git config user.name "yuisync-ci"
          git config user.email "actions@users.noreply.github.com"
          git add test/petbotAgent.test.mjs .github/workflows/apply-legacy-assertion-syntax-fix.yml
          git commit -m "test: repair legacy service summary assertion"
          git push origin HEAD:test/petbot-predictive-100x
