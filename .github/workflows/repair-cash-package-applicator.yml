name: Repair cash package applicator

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair-apply-and-validate:
    if: github.head_ref == 'fix/cash-package-accounting-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation with robust patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/apply-cash-package-accounting-layout.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          script = workflow.split("python <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(script)

          patch_start = script.index("commission_path = Path('src/modules/petshop/lib/teamCommissionSummary.js')")
          patch_end = script.index("test = r'''", patch_start)
          robust_patch = r'''commission_path = Path('src/modules/petshop/lib/teamCommissionSummary.js')
          commission = commission_path.read_text(encoding='utf-8')

          raw_start = commission.index('  const rawItems = Array.isArray(appointment.service_items)')
          raw_end = commission.index('\n\n  const eligible =', raw_start)
          new_raw = ''' + "r'''" + r'''  const serviceBenefits = (Array.isArray(appointment.subscription_benefits) ? appointment.subscription_benefits : [])
            .filter((benefit) => benefit?.kind === 'service'
              && ['reserved', 'consumed'].includes(String(benefit?.status || appointment.subscription_benefit_status || 'reserved')))
          const rawItems = Array.isArray(appointment.service_items) && appointment.service_items.length
            ? appointment.service_items
            : serviceBenefits.length
              ? serviceBenefits.map((benefit) => ({
                code: benefit.service_code || benefit.key,
                name: benefit.label || benefit.service_name || benefit.service_code || 'Servico do pacote',
                service_type: benefit.service_code || benefit.key,
                group_type: appointment.service_group || 'banho_tosa',
                unit_price: 0,
                catalog_price: benefit.catalog_price,
                subscription_benefit_used: true,
              }))
              : [{
                code: appointment.service_type,
                name: appointment.service_type,
                service_type: appointment.service_type,
                group_type: appointment.service_group || 'banho_tosa',
                unit_price: appointment.price,
              }]''' + "'''" + r'''
          commission = commission[:raw_start] + new_raw + commission[raw_end:]

          revenue_start = commission.index('    const itemRevenue = Number(item.unit_price')
          revenue_end = commission.index('\n    const rate =', revenue_start)
          new_revenue = ''' + "r'''" + r'''    const code = String(item.code || item.service_type || item.value || '').trim()
              const benefitKey = String(item.benefit_key || '').trim()
              const matchingBenefit = serviceBenefits.find((benefit) => {
                const serviceCode = String(benefit?.service_code || '').trim()
                const key = String(benefit?.key || benefit?.benefit_key || '').trim()
                return (code && serviceCode === code)
                  || (benefitKey && key === benefitKey)
                  || (eligible.length === 1 && serviceBenefits.length === 1 && !serviceCode)
              })
              const packageCovered = item.subscription_benefit_used === true
                || item.benefit_used === true
                || Boolean(matchingBenefit)
              const catalogRevenue = Number(
                item.catalog_price
                ?? item.default_price
                ?? matchingBenefit?.catalog_price
                ?? item.unit_price
                ?? item.price
                ?? 0
              )
              const netRevenue = Number(item.unit_price ?? item.price ?? 0)
              const revenue = packageCovered
                ? catalogRevenue
                : netRevenue > 0
                  ? netRevenue
                  : eligible.length === 1
                    ? Number(appointment.price || 0)
                    : 0''' + "'''" + r'''
          commission = commission[:revenue_start] + new_revenue + commission[revenue_end:]
          commission_path.write_text(commission, encoding='utf-8')

          '''
          script = script[:patch_start] + robust_patch + script[patch_end:]
          exec(compile(script, '<cash-package-applicator>', 'exec'))
          PY

      - name: Remove temporary applicators
        run: rm -f .github/workflows/apply-cash-package-accounting-layout.yml .github/workflows/repair-cash-package-applicator.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regressions
        run: node --test test/cashRegisterPackageAccounting.test.mjs test/agendaCompletionFinancialCheckout.test.mjs test/teamDeliveryAndCommissionSummary.test.mjs

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aperfeicoar caixa e contabilizacao de pacotes"
          git push origin HEAD:${{ github.head_ref }}
