name: Apply agenda print cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/apply_agenda_print_cleanup.py'
      - '.github/workflows/apply-agenda-print-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic print patch
        run: python .github/scripts/apply_agenda_print_cleanup.py
      - name: Commit print cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: simplificar impressao do agendamento"
          git push origin HEAD:${{ github.head_ref }}
