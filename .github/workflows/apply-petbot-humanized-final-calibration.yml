name: Apply PetBot Humanized Final Calibration

on:
  pull_request:
    paths:
      - scripts/apply-petbot-humanized-final-calibration.mjs
      - .github/workflows/apply-petbot-humanized-final-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply and validate calibration
        run: |
          node --check scripts/apply-petbot-humanized-final-calibration.mjs
          node scripts/apply-petbot-humanized-final-calibration.mjs
          node --check scripts/eval-petbot-humanized-50.mjs
      - name: Remove temporary calibration files
        run: |
          rm scripts/apply-petbot-humanized-final-calibration.mjs
          rm .github/workflows/apply-petbot-humanized-final-calibration.yml
      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(petbot): calibrar roteamento humanizado final"
          git push origin HEAD:test/petbot-predictive-100x
