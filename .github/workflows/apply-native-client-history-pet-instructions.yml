name: Aplicar correção nativa de histórico e instruções

on:
  push:
    branches:
      - fix/native-client-history-pet-instructions
    paths:
      - scripts/apply-native-history-pet-instructions.mjs
      - .github/workflows/apply-native-client-history-pet-instructions.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: fix/native-client-history-pet-instructions
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar alterações
        run: node scripts/apply-native-history-pet-instructions.mjs

      - name: Executar regressões específicas
        run: node --test test/clientHistoryNativeAndInstructions.test.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build

      - name: Publicar alterações na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir histórico nativo e instruções dos pets"
          git push origin HEAD:fix/native-client-history-pet-instructions
