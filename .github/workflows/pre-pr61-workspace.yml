name: Pre PR6.1 Workspace

on:
  push:
    branches:
      - feat/pre-pr61-petshop-operations

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[workspace-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source snapshot
        run: |
          git archive --format=zip --output=yuisync-pre-pr61.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: yuisync-pre-pr61-source
          path: yuisync-pre-pr61.zip
          retention-days: 1
