name: Apply agenda 10min staff and catalog fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source changes
        run: python .github/apply-agenda-10min-staff-catalog.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run test:transactions
          npm run typecheck
          npm run build

      - name: Publish functional commit
        run: |
          rm .github/apply-agenda-10min-staff-catalog.py
          rm .github/workflows/apply-agenda-10min-staff-catalog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: agenda 10min equipe persistente e catalogo real"
          git push origin HEAD:${{ github.head_ref }}
