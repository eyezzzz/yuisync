              `)
            }
          '''
          new_history = '''  function printHistory() {
              const rows = lineRows.map(({ appointment, line }) => `<section class="entry">
                <div class="row"><span>Data</span><strong>${escapeHtml(dateTimeLabel(appointment.scheduled_at))}</strong></div>
                <div class="detail"><strong>Tutor:</strong> ${escapeHtml(appointment.client?.owner_name || '-')}</div>
