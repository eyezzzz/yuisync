              "                    {appointmentCard(appt, laneCount)}\n",
          )
          replace_once(
              agenda,
              "                      {lanes.map((appt, laneIndex) => appt ? appointmentCard(appt) : (\n",
              "                      {lanes.map((appt, laneIndex) => appt ? appointmentCard(appt, visualLaneCount) : (\n",
          )
          replace_once(
