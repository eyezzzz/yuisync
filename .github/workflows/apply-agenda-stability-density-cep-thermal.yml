      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused regressions
        run: |
          node --test test/cepLookup.test.mjs test/agendaStabilityAndThermal.test.mjs
          node --test test/agendaAdaptiveCards.test.mjs test/agendaVisualStandardization.test.mjs
          npm run test:transactions

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit validated delivery
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Estabilizar agenda e padronizar operacao petshop"
          git push origin HEAD:${{ github.head_ref }}
