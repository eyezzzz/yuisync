name: Apply agenda stability and thermal refinements

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/agenda-stability-density-cep-thermal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply functional changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import base64

          def replace_once(path, old, new):
              source = path.read_text(encoding='utf-8')
              if old not in source:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              path.write_text(source.replace(old, new, 1), encoding='utf-8')

          def replace_all_checked(path, old, new, minimum=1):
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count < minimum:
                  raise SystemExit(f'Expected at least {minimum} occurrence(s) in {path}, found {count}: {old[:120]!r}')
              path.write_text(source.replace(old, new), encoding='utf-8')

          Path('src/modules/petshop/pages/AgendaIntegratedPage.jsx').write_bytes(base64.b64decode(' '))
          Path('src/modules/petshop/lib/cepLookup.js').write_bytes(base64.b64decode(''))
          Path('test/agendaStabilityAndThermal.test.mjs').write_bytes(base64.b64decode(' jcmVhdGVQZXRcfS8pCiAgYXNzZXJ0Lm1hdGNoKHBldHMsIC9CdXNjYXIgQ0VQLykKICBhc3NlcnQubWF0Y2gocGV0cywgL2xvb2t1cEJyYXppbGlhbkNlcC8pCiAgYXNzZXJ0Lm1hdGNoKGNlcCwgL3ZpYWNlcFwuY29tXC5ici9 '))
          Path('test/cepLookup.test.mjs').write_bytes(base64.b64decode(''))

          # PetsPage: CEP automatico e persistencia completa do endereco.
          pets = Path('src/modules/petshop/pages/PetsPage.jsx')
          replace_once(
              pets,
              "import { useEffect, useMemo, useState } from 'react'",
              "import { useEffect, useMemo, useRef, useState } from 'react'",
          )
          replace_once(
              pets,
              "import { createTutorGroupId, groupPetsByTutor } from '../../../shared/lib/petTutorGroups'\n",
              "import { createTutorGroupId, groupPetsByTutor } from '../../../shared/lib/petTutorGroups'\nimport { formatCepInput, lookupBrazilianCep, normalizeCep } from '../lib/cepLookup'\n",
          )
          replace_once(
              pets,
              "  const [saving, setSaving] = useState(false)\n  const [error, setError] = useState('')\n",
              "  const [saving, setSaving] = useState(false)\n  const [error, setError] = useState('')\n  const [cepState, setCepState] = useState({ loading: false, message: '' })\n  const [cepLookupNonce, setCepLookupNonce] = useState(0)\n  const cepRequestRef = useRef(0)\n  const lastCepRef = useRef('')\n",
          )
          replace_once(
              pets,
              "          tutor_birth_date: form.tutor_birth_date || null, zip_code: form.zip_code.trim(), address_number: form.address_number.trim(), address_reference: form.address_reference.trim(),\n",
              "          tutor_birth_date: form.tutor_birth_date || null, zip_code: form.zip_code.trim(), address_number: form.address_number.trim(), address_complement: form.address_complement.trim(), address_reference: form.address_reference.trim(),\n",
          )
          replace_once(
              pets,
              "  const setField = (key, value) => setForm((prev) => ({ ...prev, [key]: value }))\n",
              "  const setField = (key, value) => setForm((prev) => ({ ...prev, [key]: value }))\n\n  useEffect(() => {\n    if (addingPetForTutor) return undefined\n    const cep = normalizeCep(form.zip_code)\n    if (cep.length !== 8) {\n      lastCepRef.current = ''\n      setCepState({ loading: false, message: '' })\n      return undefined\n    }\n    if (lastCepRef.current === cep && cepLookupNonce === 0) return undefined\n\n    const requestId = ++cepRequestRef.current\n    const controller = new AbortController()\n    const timer = window.setTimeout(async () => {\n      lastCepRef.current = cep\n      setCepState({ loading: true, message: 'Buscando endereco...' })\n      try {\n        const address = await lookupBrazilianCep(cep, { signal: controller.signal })\n        if (requestId !== cepRequestRef.current) return\n        setForm((current) => ({\n          ...current,\n          zip_code: address.zip_code,\n          owner_address: address.owner_address || current.owner_address,\n          owner_neighborhood: address.owner_neighborhood || current.owner_neighborhood,\n          owner_city: address.owner_city || current.owner_city,\n          address_complement: current.address_complement || address.address_complement,\n        }))\n        setCepState({ loading: false, message: 'Endereco preenchido pelo CEP.' })\n      } catch (lookupError) {\n        if (controller.signal.aborted || requestId !== cepRequestRef.current) return\n        setCepState({ loading: false, message: lookupError.message || 'Nao foi possivel consultar o CEP.' })\n      }\n    }, cepLookupNonce ? 0 : 220)\n\n    return () => {\n      window.clearTimeout(timer)\n      controller.abort()\n    }\n  }, [addingPetForTutor, form.zip_code, cepLookupNonce])\n",
          )
          replace_once(
              pets,
              "              <div><label className=\"inp-label\">CEP</label><input className=\"inp\" value={form.zip_code || ''} onChange={(e) => setField('zip_code', e.target.value)} /></div>\n",
              """              <div>
                <label className="inp-label">CEP</label>
                <div className="flex gap-2">
                  <input className="inp min-w-0 flex-1" maxLength={9} value={form.zip_code || ''} onChange={(e) => setField('zip_code', formatCepInput(e.target.value))} />
                  <button type="button" aria-label="Buscar CEP" title="Buscar CEP" className="btn btn-secondary btn-icon" onClick={() => { lastCepRef.current = ''; setCepLookupNonce((value) => value + 1) }}>
                    <Search size={14} className={cepState.loading ? 'animate-pulse' : ''} />
                  </button>
                </div>
                {cepState.message && <p className="mt-1 text-[10px] text-muted">{cepState.message}</p>}
              </div>
""",
          )

          # AgendaPage: cadastro rapido, CEP, camadas de densidade e marcadores visuais.
          agenda = Path('src/modules/petshop/pages/AgendaPage.jsx')
          replace_once(
              agenda,
              "import { groupPetsByTutor } from '../../../shared/lib/petTutorGroups'\n",
              "import { groupPetsByTutor } from '../../../shared/lib/petTutorGroups'\nimport { formatCepInput, lookupBrazilianCep, normalizeCep } from '../lib/cepLookup'\n",
          )
          replace_once(
              agenda,
              "function MotodogAgendaInfo({ appt, compact = false }) {",
              "\nconst QUICK_CLIENT_EMPTY = {\n  owner_name: '',\n  phone: '',\n  pet_name: '',\n  species: 'dog',\n  zip_code: '',\n  owner_address: '',\n  address_number: '',\n  owner_neighborhood: '',\n  owner_city: '',\n}\n\nfunction QuickClientForm({ onCreate, onCreated, onCancel }) {\n  const [form, setForm] = useState(QUICK_CLIENT_EMPTY)\n  const [saving, setSaving] = useState(false)\n  const [error, setError] = useState('')\n  const [cepState, setCepState] = useState({ loading: false, message: '' })\n  const [cepLookupNonce, setCepLookupNonce] = useState(0)\n  const cepRequestRef = useRef(0)\n  const lastCepRef = useRef('')\n\n  const setField = (key, value) => setForm((current) => ({ ...current, [key]: value }))\n\n  useEffect(() => {\n    const cep = normalizeCep(form.zip_code)\n    if (cep.length !== 8) {\n      lastCepRef.current = ''\n      setCepState({ loading: false, message: '' })\n      return undefined\n    }\n    if (lastCepRef.current === cep && cepLookupNonce === 0) return undefined\n\n    const requestId = ++cepRequestRef.current\n    const controller = new AbortController()\n    const timer = window.setTimeout(async () => {\n      lastCepRef.current = cep\n      setCepState({ loading: true, message: 'Buscando endereco...' })\n      try {\n        const address = await lookupBrazilianCep(cep, { signal: controller.signal })\n        if (requestId !== cepRequestRef.current) return\n        setForm((current) => ({\n          ...current,\n          zip_code: address.zip_code,\n          owner_address: address.owner_address || current.owner_address,\n          owner_neighborhood: address.owner_neighborhood || current.owner_neighborhood,\n          owner_city: address.owner_city || current.owner_city,\n        }))\n        setCepState({ loading: false, message: 'Endereco preenchido pelo CEP.' })\n      } catch (lookupError) {\n        if (controller.signal.aborted || requestId !== cepRequestRef.current) return\n        setCepState({ loading: false, message: lookupError.message || 'Nao foi possivel consultar o CEP.' })\n      }\n    }, cepLookupNonce ? 0 : 220)\n\n    return () => {\n      window.clearTimeout(timer)\n      controller.abort()\n    }\n  }, [form.zip_code, cepLookupNonce])\n\n  async function submit() {\n    if (!form.owner_name.trim()) return setError('Informe o nome do tutor.')\n    if (!form.phone.trim()) return setError('Informe o telefone.')\n    if (!form.pet_name.trim()) return setError('Informe o nome do pet.')\n    if (!onCreate) return setError('Cadastro rapido indisponivel.')\n\n    setSaving(true)\n    setError('')\n    try {\n      const created = await onCreate({\n        owner_name: form.owner_name.trim(),\n        phone: form.phone.trim(),\n        pet_name: form.pet_name.trim(),\n        species: form.species,\n        zip_code: form.zip_code.trim(),\n        owner_address: form.owner_address.trim(),\n        address_number: form.address_number.trim(),\n        owner_neighborhood: form.owner_neighborhood.trim(),\n        owner_city: form.owner_city.trim(),\n      })\n      onCreated?.(created)\n    } catch (createError) {\n      setError(createError.message || 'Nao foi possivel cadastrar o cliente.')\n    } finally {\n      setSaving(false)\n    }\n  }\n\n  return (\n    <section className=\"rounded-2xl border border-amber-400/30 bg-amber-500/8 p-4 space-y-3\">\n      <div className=\"flex items-center justify-between gap-3\">\n        <div>\n          <p className=\"text-sm font-black text-text\">Cadastro rapido</p>\n          <p className=\"text-[11px] text-muted\">Cadastre tutor e pet sem sair do agendamento.</p>\n        </div>\n        <button type=\"button\" className=\"btn btn-ghost btn-sm\" onClick={onCancel}>Voltar</button>\n      </div>\n      <div className=\"grid grid-cols-1 gap-3 md:grid-cols-2\">\n        <div><label className=\"inp-label\">Tutor</label><input className=\"inp\" value={form.owner_name} onChange={(event) => setField('owner_name', event.target.value)} /></div>\n        <div><label className=\"inp-label\">Telefone</label><input className=\"inp\" value={form.phone} onChange={(event) => setField('phone', event.target.value)} /></div>\n        <div><label className=\"inp-label\">Pet</label><input className=\"inp\" value={form.pet_name} onChange={(event) => setField('pet_name', event.target.value)} /></div>\n        <div><label className=\"inp-label\">Especie</label><select className=\"inp\" value={form.species} onChange={(event) => setField('species', event.target.value)}><option value=\"dog\">Cao</option><option value=\"cat\">Gato</option><option value=\"other\">Outro</option></select></div>\n        <div>\n          <label className=\"inp-label\">CEP</label>\n          <div className=\"flex gap-2\">\n            <input className=\"inp min-w-0 flex-1\" maxLength={9} value={form.zip_code} onChange={(event) => setField('zip_code', formatCepInput(event.target.value))} />\n            <button type=\"button\" aria-label=\"Buscar CEP\" title=\"Buscar CEP\" className=\"btn btn-secondary btn-icon\" onClick={() => { lastCepRef.current = ''; setCepLookupNonce((value) => value + 1) }}>\n              <Search size={14} className={cepState.loading ? 'animate-pulse' : ''}/>\n            </button>\n          </div>\n          {cepState.message && <p className=\"mt-1 text-[10px] text-muted\">{cepState.message}</p>}\n        </div>\n        <div><label className=\"inp-label\">Numero</label><input className=\"inp\" value={form.address_number} onChange={(event) => setField('address_number', event.target.value)} /></div>\n        <div className=\"md:col-span-2\"><label className=\"inp-label\">Endereco</label><input className=\"inp\" value={form.owner_address} onChange={(event) => setField('owner_address', event.target.value)} /></div>\n        <div><label className=\"inp-label\">Bairro</label><input className=\"inp\" value={form.owner_neighborhood} onChange={(event) => setField('owner_neighborhood', event.target.value)} /></div>\n        <div><label className=\"inp-label\">Cidade</label><input className=\"inp\" value={form.owner_city} onChange={(event) => setField('owner_city', event.target.value)} /></div>\n      </div>\n      {error && <p className=\"rounded-lg border border-red-500/20 bg-red-500/10 px-3 py-2 text-xs text-red-400\">{error}</p>}\n      <button type=\"button\" disabled={saving} onClick={submit} className=\"btn btn-primary w-full justify-center\">\n        <Plus size={14}/> {saving ? 'Salvando...' : 'Salvar e selecionar'}\n      </button>\n    </section>\n  )\n}\n\nfunction MotodogAgendaInfo({ appt, compact = false }) {",
          )
          replace_once(
              agenda,
              "function ApptModal({ appt, onClose, onCreate, onUpdate, onReceipt, onRefreshSubscriptions, onManagePets, pets, services = SERVICES, subscriptions = [], staff = [], deliveryStaff = [], transportOptions = [], serviceDurations, onSearchClients, appointments = [], slotCapacity = MANUAL_SLOT_CAPACITY }) {",
              "function ApptModal({ appt, onClose, onCreate, onUpdate, onReceipt, onRefreshSubscriptions, onManagePets, onCreateClient, pets, services = SERVICES, subscriptions = [], staff = [], deliveryStaff = [], transportOptions = [], serviceDurations, onSearchClients, appointments = [], slotCapacity = MANUAL_SLOT_CAPACITY }) {",
          )
          replace_once(
              agenda,
              "  const [clientPickerOpen, setClientPickerOpen] = useState(() => !form.pet_id)\n",
              "  const [clientPickerOpen, setClientPickerOpen] = useState(() => !form.pet_id)\n  const [quickClientOpen, setQuickClientOpen] = useState(false)\n",
          )
          replace_once(
              agenda,
              "                {onManagePets && <button type=\"button\" onClick={onManagePets} className=\"btn btn-ghost btn-sm\"><PawPrint size={13}/> Gerenciar clientes e pets</button>}\n",
              """                <div className="flex flex-wrap items-center gap-2">
                  {onCreateClient && (
                    <button type="button" onClick={() => { setQuickClientOpen(true); setClientPickerOpen(false); setPendingTutorPets([]) }} className="btn btn-primary btn-sm">
                      <Plus size={13}/> Novo cliente
                    </button>
                  )}
                  {onManagePets && <button type="button" onClick={onManagePets} className="btn btn-ghost btn-sm"><PawPrint size={13}/> Gerenciar clientes e pets</button>}
                </div>
""",
          )
          replace_once(
              agenda,
              "              {!clientPickerOpen && selectedPet ? (\n",
              """              {quickClientOpen ? (
                <QuickClientForm
                  onCreate={onCreateClient}
                  onCancel={() => setQuickClientOpen(false)}
                  onCreated={(created) => {
                    setRemotePets((current) => [created, ...current.filter((item) => item.id !== created.id)])
                    selectClient(created)
                    setQuickClientOpen(false)
                  }}
                />
              ) : !clientPickerOpen && selectedPet ? (
""",
          )
          replace_once(
              agenda,
              "  const appointmentCard = (appt) => {\n",
