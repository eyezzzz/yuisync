          old_summary = '''  function printCommissionSummary() {
              const bodyRows = displayRows.map((row) => `<tr>
                <td>${escapeHtml(row.collaborator_name)}</td>
                <td>${row.bath_count}</td>
                <td>${row.machine_grooming_count}</td>
