name: Apply PetBot Final Fixes Round 2B

on:
  pull_request:
    paths:
      - scripts/apply-petbot-final-fixes-round2b.mjs
      - .github/workflows/apply-petbot-final-fixes-round2b.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - id: patch
        name: Apply and validate fixes
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            node --check scripts/apply-petbot-final-fixes-round2b.mjs
            node scripts/apply-petbot-final-fixes-round2b.mjs
            node --check server/lib/petbotGrounding.js
            node --check scripts/eval-petbot-humanized-50.mjs
            node --test test/petbotHumanizedHarness.test.mjs
            node --test test/petbotFinalRuntimeFixes.test.mjs
            node --test test/petbotSemantics.test.mjs
          } > petbot-round2b.log 2>&1
          code=$?
          cat petbot-round2b.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petbot-round2b-diagnostic
          path: petbot-round2b.log
          retention-days: 2

      - name: Stop when validation failed
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1

      - name: Remove temporary patch workflow
        run: |
          rm scripts/apply-petbot-final-fixes-round2b.mjs
          rm .github/workflows/apply-petbot-final-fixes-round2b.yml
          rm -f petbot-round2b.log

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(petbot): aplicar roteamento e validação factual final"
          git push origin HEAD:test/petbot-predictive-100x
