name: Apply PetBot Final Fixes Round 2B

on:
  pull_request:
    paths:
      - scripts/apply-petbot-final-fixes-round2b.mjs
      - .github/workflows/apply-petbot-final-fixes-round2b.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/petbot-predictive-100x
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Apply and validate fixes
        id: apply
        continue-on-error: true
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-petbot-final-fixes-round2b.mjs')
          source = path.read_text()
          source = source.replace(
              "      ? `${String(Number(preferredMatch[1])).padStart(2, '0')}:${preferredMatch[2] || '00'}`",
              "      ? String(Number(preferredMatch[1])).padStart(2, '0') + ':' + (preferredMatch[2] || '00')",
          )
          source = source.replace(
              "    const scheduledAt = `${date}T${time}:00-03:00`",
              "    const scheduledAt = date + 'T' + time + ':00-03:00'",
          )
          source = source.replace(
              "    'const scheduledAt = `${date}T${time}:00-03:00`',",
              "    \"const scheduledAt = date + 'T' + time + ':00-03:00'\",",
          )
          path.write_text(source)
          PY
          set -o pipefail
          {
            node --check scripts/apply-petbot-final-fixes-round2b.mjs
            node scripts/apply-petbot-final-fixes-round2b.mjs
            node --check server/lib/petbotGrounding.js
            node --check scripts/eval-petbot-humanized-50.mjs
            node --test test/petbotHumanizedHarness.test.mjs
            node --test test/petbotFinalRuntimeFixes.test.mjs
            node --test test/petbotSemantics.test.mjs
          } 2>&1 | tee artifacts/petbot-round2b.log

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petbot-round2b-report
          path: artifacts/petbot-round2b.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop on validation failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat artifacts/petbot-round2b.log
          exit 1

      - name: Remove temporary patch workflow
        run: |
          rm scripts/apply-petbot-final-fixes-round2b.mjs
          rm .github/workflows/apply-petbot-final-fixes-round2b.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(petbot): endurecer tools e respostas factuais da Luna"
          git push origin HEAD:test/petbot-predictive-100x
