name: Apply cash package accounting and layout

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/cash-package-accounting-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          summary = r'''const normalizeText = (value = '') => String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim()

          const activePackageStatuses = new Set(['reserved', 'consumed'])
          const transportPattern = /\b(motodog|moto\s*dog|transporte|entrega|delivery|frete|buscar|levar)\b/

          const activeServiceBenefits = (appointment = {}) => (
            (Array.isArray(appointment.subscription_benefits) ? appointment.subscription_benefits : [])
              .filter((benefit) => benefit?.kind === 'service'
                && activePackageStatuses.has(String(benefit?.status || appointment.subscription_benefit_status || 'reserved')))
          )

          const itemServiceCode = (item = {}) => String(item.code || item.service_type || item.value || '').trim()

          const itemHasPackageBenefit = (item = {}, appointment = {}, itemCount = 0) => {
            if (item?.benefit_used === true || item?.subscription_benefit_used === true) return true
            const code = itemServiceCode(item)
            const key = String(item?.benefit_key || '').trim()
            const benefits = activeServiceBenefits(appointment)
            return benefits.some((benefit) => {
              const benefitCode = String(benefit?.service_code || '').trim()
              const benefitKey = String(benefit?.key || benefit?.benefit_key || '').trim()
              return (code && benefitCode === code)
                || (key && benefitKey === key)
                || (itemCount === 1 && benefits.length === 1 && !benefitCode)
            })
          }

          export function resolveCashPeriod({ openedAt = null, dayStart, dayEnd } = {}) {
            return {
              start: openedAt || dayStart,
              end: dayEnd,
              mode: openedAt ? 'register' : 'day',
            }
          }

          export function isPackageCoveredAppointment(appointment = {}) {
            if (Math.abs(Number(appointment.price || 0)) > 0.005) return false
            const items = Array.isArray(appointment.service_items) ? appointment.service_items : []
            const itemBenefit = items.some((item) => itemHasPackageBenefit(item, appointment, items.length))
            return itemBenefit
              || activeServiceBenefits(appointment).length > 0
              || (String(appointment.subscription_benefit_status || '') === 'consumed'
                && Number(appointment.subscription_discount || 0) > 0)
          }

          const packageServiceLabel = (appointment = {}) => {
            const items = (Array.isArray(appointment.service_items) ? appointment.service_items : [])
              .filter((item) => !transportPattern.test(normalizeText([
                item?.name, item?.label, item?.code, item?.service_type,
              ].filter(Boolean).join(' '))))
            const itemNames = items.map((item) => item?.name || item?.label || item?.code || item?.service_type).filter(Boolean)
            if (itemNames.length) return [...new Set(itemNames)].join(' + ')
            const benefitNames = activeServiceBenefits(appointment)
              .map((benefit) => benefit?.label || benefit?.service_name || benefit?.service_code)
              .filter(Boolean)
            return [...new Set(benefitNames)].join(' + ')
              || appointment.service_type
              || 'Servico do pacote'
          }

          const sourceKeyForSale = (sale = {}) => {
            if (sale.subscription_id || normalizeText(sale.source) === 'assinatura') return 'subscriptions'
            if (sale.appointment_id || normalizeText(sale.source) === 'agenda') return 'agenda'
            return 'retail'
          }

          const sourceLabelForSale = (sale = {}) => {
            const key = sourceKeyForSale(sale)
            if (key === 'subscriptions') return 'Pacote pago'
            if (key === 'agenda') return 'Atendimento recebido'
            if (normalizeText(sale.source) === 'whatsapp') return 'Venda WhatsApp'
            return 'Venda PDV'
          }

          export function buildCashDashboardSummary({ sales = [], splitRows = [], packageAppointments = [] } = {}) {
            const splitMap = new Map()
            splitRows.forEach((row) => {
              const existing = splitMap.get(row.sale_id) || []
              existing.push(row)
              splitMap.set(row.sale_id, existing)
            })

            const totalsByMethod = sales.reduce((acc, sale) => {
              const saleSplits = splitMap.get(sale.id) || []
              if (saleSplits.length) {
                saleSplits.forEach((split) => {
                  const key = split.payment_method || 'outros'
                  acc[key] = (acc[key] || 0) + Number(split.amount || 0)
                })
              } else {
                const key = sale.payment_method || 'outros'
                acc[key] = (acc[key] || 0) + Number(sale.total_price || 0)
              }
              return acc
            }, {})

            const sourceSummary = {
              agenda: { count: 0, total: 0 },
              subscriptions: { count: 0, total: 0 },
              retail: { count: 0, total: 0 },
              packageConsumed: { count: packageAppointments.length, total: 0 },
            }

            const saleMovements = sales.map((sale) => {
              const sourceKey = sourceKeyForSale(sale)
              sourceSummary[sourceKey].count += 1
              sourceSummary[sourceKey].total += Number(sale.total_price || 0)
              return {
                id: `sale:${sale.id}`,
                record_type: 'sale',
                occurred_at: sale.created_at,
                source_key: sourceKey,
                source_label: sourceLabelForSale(sale),
                client_name: sale.customer_name || 'Cliente',
                pet_name: '',
                description: sale.notes || '',
                payment_method: sale.payment_method || 'outros',
                amount: Number(sale.total_price || 0),
              }
            })

            const packageMovements = packageAppointments.map((appointment) => ({
              id: `package:${appointment.id}`,
              record_type: 'package_consumption',
              occurred_at: appointment.updated_at || appointment.scheduled_at,
              source_key: 'packageConsumed',
              source_label: 'Servico de pacote',
              client_name: appointment.client?.owner_name || 'Cliente',
              pet_name: appointment.client?.pet_name || '',
              description: packageServiceLabel(appointment),
              payment_method: 'pacote',
              amount: 0,
            }))

            const movements = [...saleMovements, ...packageMovements]
              .sort((left, right) => new Date(right.occurred_at || 0) - new Date(left.occurred_at || 0))

            return {
              totalsByMethod,
              totalSales: sales.reduce((sum, sale) => sum + Number(sale.total_price || 0), 0),
              expectedCash: Number(totalsByMethod.dinheiro || 0),
              sourceSummary,
              movements,
            }
          }
          '''
          Path('src/modules/petshop/lib/cashRegisterSummary.js').write_text(summary, encoding='utf-8')

          operations = r'''import { supabase, todayISO } from '../../../lib/supabase'
          import { applyTenantFilter, buildTenantPayload, runWithTenantFallback } from '../../../lib/tenant'
          import {
            buildCashDashboardSummary,
            isPackageCoveredAppointment,
            resolveCashPeriod,
          } from './cashRegisterSummary'

          const CLIENT_SELECT = 'id,name,phone,email,address,neighborhood,city,details'

          const getDateBounds = (date) => ({
            start: new Date(`${date}T00:00:00`).toISOString(),
            end: new Date(`${date}T23:59:59.999`).toISOString(),
          })

          const isSplitSchemaError = (error) => {
            const message = String(error?.message || '').toLowerCase()
            return message.includes('sale_payment_splits') && (
              message.includes('does not exist')
              || message.includes('schema cache')
              || message.includes('relation')
              || message.includes('column')
            )
          }

          const formatClient = (client = {}) => ({
            id: client.id,
            owner_name: client.name || '',
            phone: client.phone || '',
            pet_name: client.details?.pet_name || client.name || '',
            breed: client.details?.breed || '',
          })

          const assertTenant = (tenantId) => {
            if (!tenantId) throw new Error('Selecione uma empresa ativa antes de operar o caixa.')
          }

          async function currentProfileId() {
            const { data, error } = await supabase.auth.getUser()
            if (error) throw error
            return data?.user?.id || null
          }

          async function loadClientMap({ tenantId, moduleId, clientIds = [] }) {
            const ids = [...new Set(clientIds.filter(Boolean))]
            if (!ids.length) return new Map()
            const response = await runWithTenantFallback(tenantId, async (includeTenant) => {
              let query = supabase.from('clients').select(CLIENT_SELECT).eq('module_id', moduleId).in('id', ids)
              return applyTenantFilter(query, tenantId, includeTenant)
            })
            if (response.error) throw response.error
            return new Map((response.data || []).map((client) => [client.id, client]))
          }

          export async function loadCashDashboardSnapshot({ tenantId, moduleId = 'petshop' } = {}) {
            assertTenant(tenantId)
            const runScoped = (runner) => runWithTenantFallback(tenantId, runner)
            const { start: dayStart, end: dayEnd } = getDateBounds(todayISO())

            const registerResponse = await runScoped(async (includeTenant) => {
              let query = supabase.from('cash_register').select('*').eq('module_id', moduleId).order('opened_at', { ascending: false }).limit(30)
              return applyTenantFilter(query, tenantId, includeTenant)
            })
            if (registerResponse.error) throw registerResponse.error

            const registers = registerResponse.data || []
            const current = registers.find((register) => !register.closed_at) || null
            const period = resolveCashPeriod({ openedAt: current?.opened_at, dayStart, dayEnd })

            const salesResponse = await runScoped(async (includeTenant) => {
              let query = supabase
                .from('sales')
                .select('id,appointment_id,subscription_id,client_id,customer_name,total_price,payment_method,created_at,status,source,fulfillment_type,notes')
                .eq('module_id', moduleId)
                .eq('status', 'concluido')
                .gte('created_at', period.start)
                .lte('created_at', period.end)
                .order('created_at', { ascending: false })
              return applyTenantFilter(query, tenantId, includeTenant)
            })
            if (salesResponse.error) throw salesResponse.error
            const sales = salesResponse.data || []

            let splitRows = []
            const saleIds = sales.map((sale) => sale.id).filter(Boolean)
            if (saleIds.length) {
              const splitsResponse = await runScoped(async (includeTenant) => {
                let query = supabase
                  .from('sale_payment_splits')
                  .select('sale_id,payment_method,amount,position')
                  .eq('module_id', moduleId)
                  .in('sale_id', saleIds)
                return applyTenantFilter(query, tenantId, includeTenant)
              })
              if (splitsResponse.error && !isSplitSchemaError(splitsResponse.error)) throw splitsResponse.error
              splitRows = splitsResponse.error ? [] : (splitsResponse.data || [])
            }

            const appointmentsResponse = await runScoped(async (includeTenant) => {
              let query = supabase
                .from('appointments')
                .select('id,client_id,scheduled_at,updated_at,price,status,service_type,service_group,service_items,subscription_benefit_status,subscription_benefits,subscription_label,subscription_discount')
                .eq('module_id', moduleId)
                .eq('status', 'concluido')
                .gte('updated_at', period.start)
                .lte('updated_at', period.end)
                .order('updated_at', { ascending: false })
              return applyTenantFilter(query, tenantId, includeTenant)
            })
            if (appointmentsResponse.error) throw appointmentsResponse.error

            const soldAppointmentIds = new Set(sales.map((sale) => String(sale.appointment_id || '')).filter(Boolean))
            const candidateAppointments = (appointmentsResponse.data || []).filter((appointment) => (
              !soldAppointmentIds.has(String(appointment.id)) && isPackageCoveredAppointment(appointment)
            ))
            const clientMap = await loadClientMap({
              tenantId,
              moduleId,
              clientIds: candidateAppointments.map((appointment) => appointment.client_id),
            })
            const packageAppointments = candidateAppointments.map((appointment) => ({
              ...appointment,
              client: formatClient(clientMap.get(appointment.client_id) || {}),
            }))

            const summary = buildCashDashboardSummary({ sales, splitRows, packageAppointments })
            return { registers, current, sales, packageAppointments, period, ...summary }
          }

          export async function openCashRegisterSnapshot({ tenantId, moduleId = 'petshop', openingBalance = 0, notes = '' } = {}) {
            assertTenant(tenantId)
            const profileId = await currentProfileId()
            const response = await runWithTenantFallback(tenantId, async (includeTenant) => {
              const row = buildTenantPayload({
                module_id: moduleId,
                opened_by: profileId,
                opening_balance: Number(openingBalance || 0),
                notes: notes || null,
              }, tenantId, includeTenant)
              return supabase.from('cash_register').insert(row).select('*').single()
            })
            if (response.error) throw response.error
            return response.data
          }

          export async function closeCashRegisterSnapshot({ tenantId, moduleId = 'petshop', registerId, closingBalance = 0, notes = '' } = {}) {
            assertTenant(tenantId)
            const dashboard = await loadCashDashboardSnapshot({ tenantId, moduleId })
            const current = dashboard.current
            if (!current || current.id !== registerId) throw new Error('Nenhum caixa aberto encontrado.')

            const expectedBalance = Number(current.opening_balance || 0) + Number(dashboard.expectedCash || 0)
            const counted = Number(closingBalance || 0)
            const profileId = await currentProfileId()
            const response = await runWithTenantFallback(tenantId, async (includeTenant) => {
              let query = supabase.from('cash_register').update({
                closed_by: profileId,
                closing_balance: counted,
                expected_balance: expectedBalance,
                difference: counted - expectedBalance,
                closed_at: new Date().toISOString(),
                notes: notes || current.notes || null,
              }).eq('id', registerId).eq('module_id', moduleId).select('*').single()
              return applyTenantFilter(query, tenantId, includeTenant)
            })
            if (response.error) throw response.error
            return response.data
          }
          '''
          Path('src/modules/petshop/lib/cashRegisterOperations.js').write_text(operations, encoding='utf-8')

          caixa = r'''import { useEffect, useMemo, useState } from 'react'
          import {
            Banknote,
            Calculator,
            CalendarCheck,
            CreditCard,
            Lock,
            LockOpen,
            PackageCheck,
            ReceiptText,
            RefreshCw,
            ShieldAlert,
            ShoppingCart,
            Wallet,
          } from 'lucide-react'
          import { fmtCurrency } from '../../../lib/supabase'
          import { useAuthCtx } from '../../../context/AuthContext'
          import { useModuleCtx } from '../../../context/ModuleContext'
          import {
            closeCashRegisterSnapshot,
            loadCashDashboardSnapshot,
            openCashRegisterSnapshot,
          } from '../lib/cashRegisterOperations'

          const METHOD_LABELS = {
            dinheiro: 'Dinheiro',
            pix: 'Pix',
            credito: 'Credito',
            debito: 'Debito',
            multiplo: 'Pagamento dividido',
            pacote: 'Pacote ja pago',
            cortesia: 'Cortesia',
            outros: 'Outros',
          }

          function MethodCard({ label, value, icon: Icon, tone = 'text-text', hint = '' }) {
            return (
              <div className="min-w-0 rounded-xl border border-[var(--border)] bg-card p-5">
                <div className="mb-3 flex min-w-0 items-start justify-between gap-3">
                  <div className="min-w-0">
                    <p className="break-words text-[11px] font-bold uppercase tracking-[0.14em] text-muted">{label}</p>
                    {hint && <p className="mt-1 text-[11px] leading-snug text-muted">{hint}</p>}
                  </div>
                  <Icon size={16} className={`${tone} shrink-0`} />
                </div>
                <p className={`break-words font-display font-bold leading-tight tabular-nums ${tone}`} style={{ fontSize: 'clamp(1.35rem, 2.45vw, 2rem)' }}>
                  {fmtCurrency(value)}
                </p>
              </div>
            )
          }

          function SourceCard({ label, count, total, icon: Icon, tone }) {
            return (
              <div className="min-w-0 rounded-xl border border-[var(--border2)] bg-white/[0.025] p-4">
                <div className="flex items-center justify-between gap-3">
                  <p className="text-[10px] font-black uppercase tracking-widest text-muted">{label}</p>
                  <Icon size={15} className={tone}/>
                </div>
                <p className="mt-3 text-xl font-black text-text tabular-nums">{count}</p>
                <p className={`mt-1 text-sm font-bold ${tone}`}>{fmtCurrency(total)}</p>
              </div>
            )
          }

          const dateTime = (value) => value ? new Date(value).toLocaleString('pt-BR') : '-'

          export default function CaixaPage({ setPage }) {
            const { activeTenantId } = useAuthCtx()
            const { activeModuleId } = useModuleCtx()
            const moduleId = activeModuleId || 'petshop'
            const [dashboard, setDashboard] = useState({
              registers: [], current: null, sales: [], movements: [], totalsByMethod: {}, expectedCash: 0, totalSales: 0,
              sourceSummary: {
                agenda: { count: 0, total: 0 }, subscriptions: { count: 0, total: 0 },
                retail: { count: 0, total: 0 }, packageConsumed: { count: 0, total: 0 },
              },
              period: null,
            })
            const [openingBalance, setOpeningBalance] = useState(0)
            const [openingNotes, setOpeningNotes] = useState('')
            const [closingBalance, setClosingBalance] = useState(0)
            const [closingNotes, setClosingNotes] = useState('')
            const [loading, setLoading] = useState(true)
            const [saving, setSaving] = useState(false)
            const [error, setError] = useState('')

            async function reload() {
              if (!activeTenantId) return
              setLoading(true)
              setError('')
              try {
                const data = await loadCashDashboardSnapshot({ tenantId: activeTenantId, moduleId })
                setDashboard(data)
                setClosingBalance(Number(data.expectedCash || 0) + Number(data.current?.opening_balance || 0))
                setClosingNotes(data.current?.notes || '')
              } catch (err) {
                setError(err.message || 'Nao foi possivel carregar o caixa.')
              } finally {
                setLoading(false)
              }
            }

            useEffect(() => { void reload() }, [activeTenantId, moduleId])

            async function handleOpenCashRegister() {
              setSaving(true)
              setError('')
              try {
                await openCashRegisterSnapshot({
                  tenantId: activeTenantId,
                  moduleId,
                  openingBalance: Number(openingBalance || 0),
                  notes: openingNotes,
                })
                setOpeningBalance(0)
                setOpeningNotes('')
                await reload()
              } catch (err) {
                setError(err.message)
              } finally {
                setSaving(false)
              }
            }

            async function handleCloseCashRegister() {
              if (!dashboard.current?.id) return
              setSaving(true)
              setError('')
              try {
                await closeCashRegisterSnapshot({
                  tenantId: activeTenantId,
                  moduleId,
                  registerId: dashboard.current.id,
                  closingBalance: Number(closingBalance || 0),
                  notes: closingNotes,
                })
                await reload()
              } catch (err) {
                setError(err.message)
              } finally {
                setSaving(false)
              }
            }

            const projectedClosing = Number(dashboard.expectedCash || 0) + Number(dashboard.current?.opening_balance || 0)
            const closingDifference = Number(closingBalance || 0) - projectedClosing
            const source = dashboard.sourceSummary || {}
            const periodLabel = dashboard.current
              ? `Movimentos desde a abertura em ${dateTime(dashboard.current.opened_at)}`
              : 'Movimentos financeiros de hoje'

            return (
              <div className="page animate-fade-up space-y-6 overflow-x-hidden">
                <div className="flex flex-wrap items-center justify-between gap-4">
                  <div className="min-w-0">
                    <h1 className="page-title flex items-center gap-2"><Wallet size={22} className="text-emerald-400"/> Controle de Caixa</h1>
                    <p className="page-sub">Abertura, fechamento e conferencia de vendas, pacotes e atendimentos.</p>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => void reload()} className="btn btn-secondary"><RefreshCw size={15} className={loading ? 'animate-spin' : ''}/> Atualizar</button>
                    {setPage && <button onClick={() => setPage('financeiro')} className="btn btn-secondary"><ReceiptText size={15}/> Financeiro / Notas</button>}
                  </div>
                </div>

                <div className="rounded-xl border border-sky-500/20 bg-sky-500/[0.06] px-4 py-3 text-sm text-sky-100">
                  <strong>{periodLabel}.</strong> Pacotes entram uma unica vez quando pagos; cada banho consumido aparece abaixo como R$ 0,00 e nao soma novamente no caixa.
                </div>

                <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 215px), 1fr))' }}>
                  <MethodCard label={dashboard.current ? 'Caixa aberto' : 'Caixa do dia'} value={dashboard.current ? Number(dashboard.current.opening_balance || 0) : 0} icon={dashboard.current ? LockOpen : Lock} tone={dashboard.current ? 'text-emerald-400' : 'text-muted'} hint="Saldo inicial informado"/>
                  <MethodCard label="Vendas no periodo" value={dashboard.totalSales || 0} icon={Calculator} hint="Agenda, pacotes e PDV"/>
                  <MethodCard label="Saldo fisico esperado" value={projectedClosing} icon={Banknote} tone="text-amber-400" hint="Saldo inicial + entradas em dinheiro"/>
                  <MethodCard label="Entradas em dinheiro" value={dashboard.expectedCash || 0} icon={CreditCard} tone="text-emerald-400" hint="Pix e cartoes nao entram no saldo fisico"/>
                </div>

                {error && <p className="flex items-center gap-2 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-400"><ShieldAlert size={14}/> {error}</p>}

                <div className="grid min-w-0 grid-cols-1 gap-6 xl:grid-cols-[minmax(320px,380px)_minmax(0,1fr)]">
                  <div className="min-w-0 space-y-4 rounded-2xl border border-[var(--border)] bg-card p-5">
                    <div className="flex items-center gap-2">
                      {dashboard.current ? <Lock size={16} className="text-amber-400"/> : <LockOpen size={16} className="text-emerald-400"/>}
                      <h2 className="section-title">{dashboard.current ? 'Fechar caixa' : 'Abrir caixa'}</h2>
                    </div>

                    {!dashboard.current ? (
                      <>
                        <div><label className="inp-label">Valor inicial</label><input aria-label="Valor inicial do caixa" className="inp" type="number" min="0" step="0.01" value={openingBalance} onChange={(event) => setOpeningBalance(event.target.value)}/></div>
                        <div><label className="inp-label">Observacoes</label><textarea className="inp h-32 resize-none p-4" value={openingNotes} onChange={(event) => setOpeningNotes(event.target.value)} placeholder="Ex.: troco inicial da recepcao"/></div>
                        <button onClick={handleOpenCashRegister} disabled={saving || loading} className="btn btn-primary w-full justify-center"><LockOpen size={15}/> {saving ? 'Abrindo...' : 'Abrir caixa'}</button>
                      </>
                    ) : (
                      <>
                        <div className="space-y-3 rounded-2xl border border-[var(--border)] bg-white/5 p-4 text-sm">
                          <div className="flex flex-wrap items-start justify-between gap-2"><span className="text-muted">Aberto em</span><span className="break-words text-right font-semibold text-text">{dateTime(dashboard.current.opened_at)}</span></div>
                          <div className="flex items-center justify-between gap-2"><span className="text-muted">Saldo inicial</span><span className="font-semibold text-text">{fmtCurrency(dashboard.current.opening_balance || 0)}</span></div>
                          <div className="flex items-center justify-between gap-2"><span className="text-muted">Entradas em dinheiro</span><span className="font-semibold text-emerald-400">{fmtCurrency(dashboard.expectedCash || 0)}</span></div>
                          <div className="flex items-center justify-between gap-2"><span className="text-muted">Saldo fisico esperado</span><span className="font-semibold text-amber-400">{fmtCurrency(projectedClosing)}</span></div>
                        </div>
                        <div><label className="inp-label">Saldo contado</label><input aria-label="Saldo contado no fechamento" className="inp" type="number" min="0" step="0.01" value={closingBalance} onChange={(event) => setClosingBalance(event.target.value)}/></div>
                        <div className={`rounded-xl border px-4 py-3 text-sm ${Math.abs(closingDifference) < 0.01 ? 'border-emerald-500/20 bg-emerald-500/10 text-emerald-300' : 'border-amber-500/20 bg-amber-500/10 text-amber-300'}`}>
                          Diferenca prevista: <strong>{fmtCurrency(closingDifference)}</strong>
                        </div>
                        <div><label className="inp-label">Observacoes de fechamento</label><textarea className="inp h-28 resize-none p-4" value={closingNotes} onChange={(event) => setClosingNotes(event.target.value)} placeholder="Ex.: sangria, reforco de troco ou divergencia"/></div>
                        <button onClick={handleCloseCashRegister} disabled={saving || loading} className="btn btn-primary w-full justify-center"><Lock size={15}/> {saving ? 'Fechando...' : 'Fechar caixa'}</button>
                      </>
                    )}
                  </div>

                  <div className="min-w-0 space-y-6">
                    <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 165px), 1fr))' }}>
                      <MethodCard label={METHOD_LABELS.dinheiro} value={dashboard.totalsByMethod.dinheiro || 0} icon={Banknote} tone="text-emerald-400"/>
                      <MethodCard label={METHOD_LABELS.pix} value={dashboard.totalsByMethod.pix || 0} icon={CreditCard} tone="text-sky-400"/>
                      <MethodCard label={METHOD_LABELS.credito} value={dashboard.totalsByMethod.credito || 0} icon={CreditCard} tone="text-violet-400"/>
                      <MethodCard label={METHOD_LABELS.debito} value={dashboard.totalsByMethod.debito || 0} icon={CreditCard} tone="text-amber-400"/>
                    </div>

                    <div className="rounded-2xl border border-[var(--border)] bg-card p-5">
                      <div className="mb-4"><h2 className="section-title">Origem dos movimentos</h2><p className="mt-1 text-xs text-muted">O consumo de pacote e informativo e permanece zerado financeiramente.</p></div>
                      <div className="grid gap-3" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 145px), 1fr))' }}>
                        <SourceCard label="Agenda" count={source.agenda?.count || 0} total={source.agenda?.total || 0} icon={CalendarCheck} tone="text-sky-400"/>
                        <SourceCard label="Pacotes pagos" count={source.subscriptions?.count || 0} total={source.subscriptions?.total || 0} icon={PackageCheck} tone="text-amber-400"/>
                        <SourceCard label="PDV / WhatsApp" count={source.retail?.count || 0} total={source.retail?.total || 0} icon={ShoppingCart} tone="text-emerald-400"/>
                        <SourceCard label="Banhos de pacote" count={source.packageConsumed?.count || 0} total={0} icon={PackageCheck} tone="text-violet-400"/>
                      </div>
                    </div>

                    <div className="min-w-0 overflow-hidden rounded-2xl border border-[var(--border)] bg-card">
                      <div className="border-b border-[var(--border2)] px-5 py-4"><h2 className="section-title">Movimentos do caixa</h2><p className="mt-1 text-xs text-muted">Pagamentos e servicos de pacote realizados no periodo do caixa.</p></div>
                      <div className="overflow-x-auto">
                        <table className="tbl min-w-[860px]">
                          <thead><tr><th>Data</th><th>Origem</th><th>Cliente / Pet</th><th>Descricao</th><th>Pagamento</th><th>Valor</th></tr></thead>
                          <tbody>
                            {(dashboard.movements || []).map((movement) => (
                              <tr key={movement.id}>
                                <td>{dateTime(movement.occurred_at)}</td>
                                <td><span className={`badge ${movement.record_type === 'package_consumption' ? 'badge-blue' : 'badge-green'}`}>{movement.source_label}</span></td>
                                <td><p className="font-semibold text-text">{movement.client_name}</p>{movement.pet_name && <p className="text-xs text-muted">{movement.pet_name}</p>}</td>
                                <td className="max-w-[280px] whitespace-normal text-xs text-muted">{movement.description || '-'}</td>
                                <td>{METHOD_LABELS[movement.payment_method] || movement.payment_method || '-'}</td>
                                <td className={movement.amount === 0 ? 'font-bold text-sky-400' : 'font-bold text-emerald-400'}>{fmtCurrency(movement.amount)}</td>
                              </tr>
                            ))}
                            {!dashboard.movements?.length && !loading && <tr><td colSpan={6} className="py-10 text-center text-muted">Nenhum movimento no periodo atual.</td></tr>}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="min-w-0 overflow-hidden rounded-2xl border border-[var(--border)] bg-card">
                      <div className="border-b border-[var(--border2)] px-5 py-4"><h2 className="section-title">Historico de caixas</h2></div>
                      <div className="overflow-x-auto">
                        <table className="tbl min-w-[760px]">
                          <thead><tr><th>Abertura</th><th>Fechamento</th><th>Inicial</th><th>Esperado</th><th>Contado</th><th>Diferenca</th></tr></thead>
                          <tbody>
                            {(dashboard.registers || []).map((register) => (
                              <tr key={register.id}>
                                <td>{dateTime(register.opened_at)}</td><td>{register.closed_at ? dateTime(register.closed_at) : 'Em aberto'}</td>
                                <td>{fmtCurrency(register.opening_balance || 0)}</td><td>{register.expected_balance != null ? fmtCurrency(register.expected_balance) : '-'}</td>
                                <td>{register.closing_balance != null ? fmtCurrency(register.closing_balance) : '-'}</td>
                                <td className={Number(register.difference || 0) === 0 ? 'font-semibold text-emerald-400' : 'font-semibold text-amber-400'}>{register.difference != null ? fmtCurrency(register.difference) : '-'}</td>
                              </tr>
                            ))}
                            {!dashboard.registers.length && !loading && <tr><td colSpan={6} className="py-10 text-center text-muted">Nenhum fechamento registrado ainda.</td></tr>}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )
          }
          '''
          Path('src/modules/petshop/pages/CaixaPage.jsx').write_text(caixa, encoding='utf-8')

          commission_path = Path('src/modules/petshop/lib/teamCommissionSummary.js')
          commission = commission_path.read_text(encoding='utf-8')
          old_raw = r'''  const rawItems = Array.isArray(appointment.service_items) && appointment.service_items.length
            ? appointment.service_items
            : [{
              code: appointment.service_type,
              name: appointment.service_type,
              service_type: appointment.service_type,
              group_type: appointment.service_group || 'banho_tosa',
              unit_price: appointment.price,
            }]
          '''
          new_raw = r'''  const serviceBenefits = (Array.isArray(appointment.subscription_benefits) ? appointment.subscription_benefits : [])
            .filter((benefit) => benefit?.kind === 'service'
              && ['reserved', 'consumed'].includes(String(benefit?.status || appointment.subscription_benefit_status || 'reserved')))
          const rawItems = Array.isArray(appointment.service_items) && appointment.service_items.length
            ? appointment.service_items
            : serviceBenefits.length
              ? serviceBenefits.map((benefit) => ({
                code: benefit.service_code || benefit.key,
                name: benefit.label || benefit.service_name || benefit.service_code || 'Servico do pacote',
                service_type: benefit.service_code || benefit.key,
                group_type: appointment.service_group || 'banho_tosa',
                unit_price: 0,
                catalog_price: benefit.catalog_price,
                subscription_benefit_used: true,
              }))
              : [{
                code: appointment.service_type,
                name: appointment.service_type,
                service_type: appointment.service_type,
                group_type: appointment.service_group || 'banho_tosa',
                unit_price: appointment.price,
              }]
          '''
          if old_raw not in commission:
            raise SystemExit('rawItems block not found')
          commission = commission.replace(old_raw, new_raw, 1)

          old_revenue = r'''    const itemRevenue = Number(item.unit_price ?? item.catalog_price ?? item.price ?? 0)
              const revenue = itemRevenue > 0
                ? itemRevenue
                : eligible.length === 1
                  ? Number(appointment.price || 0)
                  : 0
          '''
          new_revenue = r'''    const code = String(item.code || item.service_type || item.value || '').trim()
              const benefitKey = String(item.benefit_key || '').trim()
              const matchingBenefit = serviceBenefits.find((benefit) => {
                const serviceCode = String(benefit?.service_code || '').trim()
                const key = String(benefit?.key || benefit?.benefit_key || '').trim()
                return (code && serviceCode === code)
                  || (benefitKey && key === benefitKey)
                  || (eligible.length === 1 && serviceBenefits.length === 1 && !serviceCode)
              })
              const packageCovered = item.subscription_benefit_used === true
                || item.benefit_used === true
                || Boolean(matchingBenefit)
              const catalogRevenue = Number(
                item.catalog_price
                ?? item.default_price
                ?? matchingBenefit?.catalog_price
                ?? item.unit_price
                ?? item.price
                ?? 0
              )
              const netRevenue = Number(item.unit_price ?? item.price ?? 0)
              const revenue = packageCovered
                ? catalogRevenue
                : netRevenue > 0
                  ? netRevenue
                  : eligible.length === 1
                    ? Number(appointment.price || 0)
                    : 0
          '''
          if old_revenue not in commission:
            raise SystemExit('revenue block not found')
          commission = commission.replace(old_revenue, new_revenue, 1)
          commission_path.write_text(commission, encoding='utf-8')

          test = r'''import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          import test from 'node:test'

          import {
            buildCashDashboardSummary,
            isPackageCoveredAppointment,
            resolveCashPeriod,
          } from '../src/modules/petshop/lib/cashRegisterSummary.js'
          import { appointmentCommissionLines } from '../src/modules/petshop/lib/teamCommissionSummary.js'

          test('banho coberto pelo pacote fica zerado no caixa e comissiona pelo catalogo', () => {
            const appointment = {
              id: 'package-bath',
              price: 0,
              service_group: 'banho_tosa',
              subscription_benefit_status: 'consumed',
              subscription_discount: 55,
              service_items: [{
                code: 'banho_0_10',
                name: 'Banho 0 a 10 kg',
                group_type: 'banho_tosa',
                unit_price: 0,
                catalog_price: 55,
                subscription_benefit_used: true,
              }],
              subscription_benefits: [{
                kind: 'service', service_code: 'banho_0_10', label: 'Banho 0 a 10 kg',
                catalog_price: 55, status: 'consumed',
              }],
            }

            assert.equal(isPackageCoveredAppointment(appointment), true)
            const [line] = appointmentCommissionLines(appointment)
            assert.equal(line.category, 'bath')
            assert.equal(line.revenue, 55)
            assert.equal(line.commission, 2.75)
          })

          test('pacote e cobrado uma vez e consumos aparecem como movimentos de zero reais', () => {
            const summary = buildCashDashboardSummary({
              sales: [{
                id: 'sale-package', subscription_id: 'subscription-1', source: 'assinatura',
                total_price: 200, payment_method: 'pix', created_at: '2026-07-31T12:00:00Z',
                customer_name: 'Tutora', notes: 'Pacote mensal',
              }],
              packageAppointments: [{
                id: 'bath-1', price: 0, updated_at: '2026-07-31T13:00:00Z',
                service_type: 'banho_0_10', service_group: 'banho_tosa',
                subscription_benefit_status: 'consumed', subscription_discount: 55,
                service_items: [{ name: 'Banho 0 a 10 kg', catalog_price: 55, unit_price: 0, subscription_benefit_used: true }],
                client: { owner_name: 'Tutora', pet_name: 'Pet' },
              }],
            })

            assert.equal(summary.totalSales, 200)
            assert.equal(summary.totalsByMethod.pix, 200)
            assert.equal(summary.sourceSummary.subscriptions.count, 1)
            assert.equal(summary.sourceSummary.packageConsumed.count, 1)
            assert.deepEqual(summary.movements.map((movement) => movement.amount).sort((a, b) => a - b), [0, 200])
          })

          test('caixa reaberto usa somente vendas posteriores a nova abertura', () => {
            const period = resolveCashPeriod({
              openedAt: '2026-07-31T15:00:00Z',
              dayStart: '2026-07-31T03:00:00Z',
              dayEnd: '2026-08-01T02:59:59Z',
            })
            assert.equal(period.start, '2026-07-31T15:00:00Z')
            assert.equal(period.mode, 'register')
          })

          test('tela do caixa usa grade fluida e operacoes financeiras integradas', async () => {
            const [page, operations] = await Promise.all([
              readFile(new URL('../src/modules/petshop/pages/CaixaPage.jsx', import.meta.url), 'utf8'),
              readFile(new URL('../src/modules/petshop/lib/cashRegisterOperations.js', import.meta.url), 'utf8'),
            ])
            assert.match(page, /repeat\(auto-fit/)
            assert.match(page, /Movimentos do caixa/)
            assert.match(page, /Banhos de pacote/)
            assert.match(operations, /openedAt: current\?\.opened_at/)
            assert.match(operations, /isPackageCoveredAppointment/)
            assert.match(operations, /sale_payment_splits/)
          })
          '''
          Path('test/cashRegisterPackageAccounting.test.mjs').write_text(test, encoding='utf-8')
          PY

      - name: Remove temporary applicator
        run: rm -f .github/workflows/apply-cash-package-accounting-layout.yml

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused regressions
        run: node --test test/cashRegisterPackageAccounting.test.mjs test/agendaCompletionFinancialCheckout.test.mjs test/teamDeliveryAndCommissionSummary.test.mjs

      - name: Build
        run: npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aperfeicoar caixa e contabilizacao de pacotes"
          git push origin HEAD:${{ github.head_ref }}
