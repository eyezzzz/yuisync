<svg width="900" height="900" viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 450) rotate(90) scale(360)">
      <stop stop-color="#2A6CFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#143062" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
